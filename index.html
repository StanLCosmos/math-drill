/* ============================ engine ============================ */
let state = null;
const $ = id => document.getElementById(id);

function buildSet(grade){
  const take = (arr, k) => { let o = []; while(o.length < k) o = o.concat(SH(arr)); return o.slice(0,k); };
  const comp = COMP[grade] || [];
  // 入試と同じ構成：前半は計算・小問、後半に応用問題を 3〜5問
  const nc = comp.length ? Math.min(R(3,5), comp.length) : 0;
  const order = take(BANK[grade], 15-nc).concat(take(comp, nc));
  const out = [], seen = new Set();
  for(const gen of order){
    let q = null;
    for(let k=0;k<12;k++){
      const cand = gen();
      const key = L(cand.q);
      if(!seen.has(key)){ q = cand; seen.add(key); break; }
      q = cand;
    }
    out.push(q);
  }
  return out;
}

function fmtTime(ms){
  const s = Math.round(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function startQuiz(grade){
  if(lockState(grade)){ show('scStart'); drawStart(); return; }   // 念のための二重チェック
  spendLife();
  state = {grade, qs: buildSet(grade), i:0, ans:new Array(15).fill(null),
           t0: Date.now(), timer:null};
  state.base = state.qs.reduce((s,q)=>s+q.sec,0);
  show('scQuiz');
  drawRail();
  renderQ();
  drawGate();
  state.timer = setInterval(tick, 250);
  tick();
}
function tick(){
  const el = $('clock'), ms = Date.now()-state.t0;
  el.textContent = fmtTime(ms);
  el.classList.toggle('warn', ms/1000 > state.base*1.5);
}
function drawRail(){
  const r = $('rail'); r.innerHTML='';
  for(let i=0;i<15;i++){
    const d = document.createElement('div');
    const firstHard = state.qs[i].hard && (i===0 || !state.qs[i-1].hard);
    d.className = 'cell' + (state.ans[i]!=null?' done':'') + (i===state.i?' now':'') + (firstHard?' sec':'');
    d.textContent = i+1;
    r.appendChild(d);
  }
}
function renderQ(){
  const q = state.qs[state.i], i = state.i;
  $('qno').textContent = L(UI.qofn(i+1,15));
  $('qtag').textContent = L(q.tag);
  $('qtag').className = 'tag' + (q.hard ? ' hard' : '');
  $('qtext').innerHTML = L(q.q).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/\[\[(.+?)\]\]/g,'<b>$1</b>');
  $('qfig').innerHTML = q.fig ? '<pre class="fig">'+L(q.fig)+'</pre>' : '';
  const box = $('qans'); box.innerHTML = '';
  if(q.kind==='choice'){
    const g = document.createElement('div'); g.className='opts';
    q.opts.forEach((o,k)=>{
      const b = document.createElement('button');
      b.type='button'; b.className='opt'; b.setAttribute('aria-pressed', state.ans[i]===k);
      b.innerHTML = '<span class="key">'+(k+1)+'</span><span></span>';
      b.lastChild.textContent = L(o);
      b.onclick = ()=>{ state.ans[i]=k; renderQ(); drawRail(); };
      g.appendChild(b);
    });
    box.appendChild(g);
    $('qhint').textContent = L(UI.qhintC);
  }else{
    const w = document.createElement('div'); w.className='fill';
    const inp = document.createElement('input');
    inp.type='text'; inp.inputMode = q.note ? 'text' : 'decimal'; inp.autocomplete='off';
    inp.setAttribute('aria-label', L(UI.answerU));
    inp.value = state.ans[i]==null ? '' : state.ans[i];
    inp.oninput = ()=>{ state.ans[i] = inp.value.trim()===''?null:inp.value; drawRail(); };
    inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); nextQ(); } };
    w.appendChild(inp);
    if(q.unit){ const u=document.createElement('span'); u.className='unit'; u.textContent=L(q.unit); w.appendChild(u); }
    box.appendChild(w);
    if(q.note){ const n=document.createElement('div'); n.className='note'; n.textContent=L(q.note); box.appendChild(n); }
    $('qhint').textContent = L(UI.qhint);
    setTimeout(()=>inp.focus(),0);
  }
  $('nextBtn').textContent = L(i===14 ? UI.last : UI.next);
  drawRail();
}
function nextQ(){
  if(state.i===14) finish(); else { state.i++; renderQ(); }
}
function judge(q, a){
  if(a==null) return false;
  if(q.kind==='choice') return a===q.ci;
  return same(parseNum(a), q.val);
}
function finish(){
  clearInterval(state.timer);
  const ms = Date.now()-state.t0, sec = ms/1000;
  const ok = state.qs.map((q,i)=>judge(q,state.ans[i]));
  const hit = ok.filter(Boolean).length;
  const ratio = sec/state.base;
  const rank = ratio<=1 ? 'A' : ratio<=1.2 ? 'B' : ratio<=1.5 ? 'C' : 'D';
  state.res = {ms, ok, hit, ratio, rank};
  state.viewing = null;
  show('scResult');
  paintResult();
  saveLog();
  const rankBefore = shownRank();
  if(hit === 15) markCleared(state.grade);
  const rankAfter = shownRank();
  // 位が ほんとうに 上がったときだけ 成就ページを 出す
  state.rankEarned = rankScore(rankAfter) > rankScore(rankBefore) ? rankAfter : null;
  drawGate();
  window.scrollTo({top:0, behavior:'smooth'});
  if(hit === 15) celebrate();
}
function paintResult(){
  const {ms, ok, hit, ratio, rank} = state.res;
  $('rTitle').textContent = L(UI.rTitle);
  const when = $('rWhen');
  when.classList.toggle('hidden', !state.viewing);
  if(state.viewing){
    const d = new Date(state.viewing), p = n => String(n).padStart(2,'0');
    when.textContent = L(UI.past(`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`));
  }
  $('rL1').textContent = L(UI.L1);
  $('rL2').textContent = L(UI.L2);
  $('rAcc').innerHTML = Math.round(hit/15*100)+'<small>%</small>';
  $('rAccM').textContent = L(UI.hitN(hit));
  $('rBar').style.width = (hit/15*100)+'%';
  $('rTime').textContent = fmtTime(ms);
  $('rTimeM').textContent = L(UI.target)+' '+fmtTime(state.base*1000)+' ・ '+L(UI.ratio(Math.round(ratio*100)));
  const rk = $('rRank'); rk.textContent = rank; rk.className = 'rank'+(rank==='D'?' d':'');
  $('rScale').textContent = L(UI.scale);
  const rv = $('review'); rv.innerHTML='';
  state.qs.forEach((q,i)=>{
    const d = document.createElement('div');
    d.className = 'rv'+(ok[i]?'':' bad');
    const mine = state.ans[i]==null ? L(UI.blank)
      : (q.kind==='choice' ? L(q.opts[state.ans[i]]) : state.ans[i]);
    const right = q.kind==='choice' ? L(q.opts[q.ci]) : q.disp;
    d.innerHTML = '<div class="mark">'+(ok[i]?'○':'×')+'</div><div class="body">'
      + (q.hard?'<span class="tag hard rvtag"></span>':'')
      + '<div class="q"></div>'+(q.fig?'<pre class="fig rvfig"></pre>':'')
      + '<div class="ans"><span>'+L(UI.your)+'：<b class="m"></b></span>'
      + (ok[i]?'':'<span>'+L(UI.correct)+'：<b class="r"></b></span>')+'</div>'
      + '<div class="exp"></div></div>';
    if(q.hard) d.querySelector('.rvtag').textContent = L(q.tag);
    d.querySelector('.q').textContent = (i+1)+'. '+L(q.q).replace(/\[\[|\]\]/g,'');
    if(q.fig) d.querySelector('.rvfig').textContent = L(q.fig);
    d.querySelector('.m').textContent = mine;
    if(!ok[i]) d.querySelector('.r').textContent = right;
    d.querySelector('.exp').textContent = L(q.exp);
    rv.appendChild(d);
  });
}

/* ---------- ライフと renew ----------
   6時間ごとの固定ウィンドウ（0時・6時・12時・18時）。1回の挑戦で ライフを 1つ消費し、
   全問正解するか ライフが尽きると、つぎの renew まで おやすみ。 */
const CYCLE_MS = 6*60*60*1000, MAX_LIVES = 15;
const windowStart = (t=Date.now()) => { const d=new Date(t); d.setHours(Math.floor(d.getHours()/6)*6,0,0,0); return d.getTime(); };
const nextRenew  = (t=Date.now()) => windowStart(t) + CYCLE_MS;
function readCycle(){
  let c = null;
  try { c = JSON.parse(localStorage.getItem('md_cycle')||'null'); } catch(e){}
  const ws = windowStart();
  if(!c || c.ws !== ws) c = {ws:ws, lives:MAX_LIVES, cleared:[]};   // ウィンドウが変われば自動でもどる
  // cleared は「全問正解した学年」の一覧。旧版の true/false 形式は学年がわからないので空にもどす
  if(!Array.isArray(c.cleared)) c.cleared = [];
  c.cleared = c.cleared.filter(g => Number.isInteger(g) && g>=1 && g<=6);
  if(typeof c.lives !== 'number' || c.lives < 0 || c.lives > MAX_LIVES) c.lives = MAX_LIVES;
  return c;
}
function writeCycle(c){ try { localStorage.setItem('md_cycle', JSON.stringify(c)); } catch(e){} }
/* その学年に挑戦できるか。null = できる / 'empty' = ライフ切れ / 'cleared' = その学年はクリア済み */
function lockState(grade){
  const c = readCycle();
  if(c.lives <= 0) return 'empty';
  return (grade && c.cleared.includes(grade)) ? 'cleared' : null;
}
/* 画面ぜんたいを止めるか。ライフ切れ、または6学年すべてクリアしたときだけ */
function globalLock(){
  const c = readCycle();
  if(c.lives <= 0) return 'empty';
  return c.cleared.length >= 6 ? 'all' : null;
}
function spendLife(){ const c = readCycle(); c.lives = Math.max(0, c.lives-1); writeCycle(c); return c; }
function markCleared(grade){
  const c = readCycle();
  if(!c.cleared.includes(grade)) c.cleared.push(grade);
  c.clearedAt = Date.now();
  // 位は クリアした瞬間だけ 結算する。あとで しくじっても、とどいた位は そのまま
  writeCycle(c);
  // クリアした その時点の位を 記録に のこす（金以上だけ 日数がつく）
  saveRetained(c.cleared.length, (MAX_LIVES - c.lives) === c.cleared.length);
}
const clearedNames = () => readCycle().cleared.sort((a,b)=>a-b).map(g => L(UI.gradeN(g))).join('・');
function untilRenew(){
  const ms = Math.max(0, nextRenew()-Date.now());
  return {h:Math.floor(ms/3600000), m:Math.floor(ms/60000)%60, ms:ms};
}
function renewText(){ const u = untilRenew(); return L(UI.hm(u.h,u.m)); }

/* ---------- 位（ランク）----------
   その回のウィンドウで クリアした学年の数が 位。つかったライフと クリア数が
   同じなら「完全」── 一度も 取りこぼしていない、という意味。 */
/* 位を 何日 のこすか。完全金だけ3日（ふつうの金は のこらない）、白金4・金剛5・伝説6・神7 */
function keepDays(tier, perfect){
  if(tier <= 2) return 0;
  if(tier === 3) return perfect ? 3 : 0;
  if(tier === 6) return perfect ? 7 : 6;
  return tier;                                  // 4→4日、5→5日
}
const isDivine = r => !!(r && r.tier === 6 && r.perfect);   // 完全伝説 ＝ 神
/* 金から上は、画面ぜんたいの意匠が 位に そまる。
   ふつうの金は のこらないので、renew と いっしょに 意匠も消える */
function rankTheme(r){
  if(!r) return '';
  if(r.tier === 6) return r.perfect ? 'divine' : 'legend';
  if(r.tier === 5) return 'diamond';
  if(r.tier === 4) return 'platinum';
  if(r.tier === 3) return 'gold';
  return '';
}
const METAL = {
  1:{a:'#F0B884',b:'#B87333',c:'#6E4118',ring:'#8A5626'},   // 銅
  2:{a:'#F4F8FC',b:'#A9B4C0',c:'#69747F',ring:'#7D8894'},   // 銀
  3:{a:'#FBE9A8',b:'#C9971F',c:'#7E5A0C',ring:'#A2770F'},   // 金
  4:{a:'#FFFFFF',b:'#C6D2DC',c:'#7C8C9C',ring:'#94A3B1'},   // 白金
  5:{a:'#EAFBFF',b:'#74CDE6',c:'#2A7690',ring:'#3F97B4'},   // 金剛
  6:{a:'#FFD79A',b:'#C3402B',c:'#6E1A10',ring:'#C9971F'}    // 伝説
};
let badgeSeq = 0;
/* 神：最高位だけの意匠。御来光の光背に、宝玉をちりばめた輪、冠、そして「神」の一字 */
function divineBadge(){
  const u = 'd'+(++badgeSeq), cx = 50, cy = 50;
  let rays = '';
  for(let i=0;i<36;i++){ const long = i%2===0, r0 = 30, r1 = long ? 49 : 40, w = long ? 2.6 : 1.3;
    rays += `<path d="M${cx-w} ${cy-r0} L${cx} ${cy-r1} L${cx+w} ${cy-r0} Z" fill="url(#ry${u})"
             transform="rotate(${i*10} ${cx} ${cy})"/>`; }
  let gems = '';
  for(let i=0;i<8;i++){ const a=(i*45-90)*Math.PI/180, x=cx+28.5*Math.cos(a), y=cy+28.5*Math.sin(a);
    gems += `<path d="M${x.toFixed(1)} ${(y-3.4).toFixed(1)} L${(x+2.8).toFixed(1)} ${y.toFixed(1)}
             L${x.toFixed(1)} ${(y+3.4).toFixed(1)} L${(x-2.8).toFixed(1)} ${y.toFixed(1)} Z"
             fill="#FFF6DA" stroke="#C9971F" stroke-width=".7"/>`; }
  return `<svg viewBox="0 0 100 100" class="badge perfect divine" aria-hidden="true">
    <defs>
      <radialGradient id="ry${u}" cx=".5" cy=".5" r=".5">
        <stop offset=".55" stop-color="#F7D477" stop-opacity=".2"/><stop offset="1" stop-color="#F0C047" stop-opacity=".95"/>
      </radialGradient>
      <radialGradient id="hl${u}" cx=".5" cy=".5" r=".5">
        <stop offset=".6" stop-color="#FFEFC0" stop-opacity=".55"/><stop offset="1" stop-color="#FFEFC0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="dm${u}" x1=".2" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#F7E2A6"/><stop offset=".38" stop-color="#C3402B"/>
        <stop offset="1" stop-color="#5E1409"/>
      </linearGradient>
      <linearGradient id="rim${u}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FBEBB4"/><stop offset=".5" stop-color="#C9971F"/><stop offset="1" stop-color="#8A6410"/>
      </linearGradient>
      <linearGradient id="sw${u}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="cp${u}"><circle cx="${cx}" cy="${cy}" r="22"/></clipPath>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="46" fill="url(#hl${u})"/>
    <g class="rays">${rays}</g>
    <circle cx="${cx}" cy="${cy}" r="28.5" fill="none" stroke="url(#rim${u})" stroke-width="3.4"/>
    ${gems}
    <path d="M${cx-15} 20 L${cx-17.5} 4 L${cx-7} 13 L${cx} 0 L${cx+7} 13 L${cx+17.5} 4 L${cx+15} 20 Z"
      fill="#FBEBB4" stroke="#C9971F" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${cx}" cy="4.5" r="3" fill="#C3402B"/>
    <circle cx="${cx}" cy="${cy}" r="22" fill="url(#dm${u})" stroke="url(#rim${u})" stroke-width="2.4"/>
    <circle cx="${cx}" cy="${cy}" r="18" fill="none" stroke="#F7E2A6" stroke-width=".8" opacity=".5"/>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central" font-family="var(--disp)"
      font-size="24" font-weight="600" fill="#FFF1C9">神</text>
    <rect class="shine" x="-40" y="${cy-22}" width="22" height="44" fill="url(#sw${u})" clip-path="url(#cp${u})"/>
  </svg>`;
}
function rankBadge(tier, perfect){
  if(tier === 6 && perfect) return divineBadge();
  const m = METAL[tier], u = 'b'+(++badgeSeq), cx = 50, cy = perfect ? 46 : 44, R = perfect ? 26 : 30;
  const kanji = '一二三四五六'[tier-1];
  let s = `<svg viewBox="0 0 100 100" class="badge${perfect?' perfect':''}" aria-hidden="true">
    <defs>
      <linearGradient id="g${u}" x1=".2" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="${m.a}"/><stop offset=".45" stop-color="${m.b}"/><stop offset="1" stop-color="${m.c}"/>
      </linearGradient>
      <linearGradient id="h${u}" x1="0" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="w${u}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <clipPath id="c${u}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
    </defs>`;
  // 完全位：うしろに光芒
  if(perfect){
    let rays = '';
    for(let i=0;i<20;i++) rays += `<path d="M${cx} ${cy} L${cx-2.4} 1 L${cx+2.4} 1 Z" fill="${GOLD2}" transform="rotate(${i*18} ${cx} ${cy})"/>`;
    s += `<g class="rays" opacity=".45">${rays}</g>`;
  }
  // リボン
  s += `<path d="M${cx-16} ${cy+16} L${cx-27} 97 L${cx-11} 88 L${cx-2} 97 Z" fill="${m.c}"/>
        <path d="M${cx+16} ${cy+16} L${cx+27} 97 L${cx+11} 88 L${cx+2} 97 Z" fill="${m.b}"/>`;
  // 位ごとの わく
  if(tier === 2){                                        // 銀：ふちに 珠
    let beads=''; for(let i=0;i<16;i++){ const a=i*22.5*Math.PI/180;
      beads += `<circle cx="${(cx+(R+3.4)*Math.cos(a)).toFixed(1)}" cy="${(cy+(R+3.4)*Math.sin(a)).toFixed(1)}" r="1.9" fill="${m.ring}"/>`; }
    s += beads;
  } else if(tier === 3){                                 // 金：ふちに 光芒
    let sp=''; for(let i=0;i<16;i++){ const a=(i*22.5-90)*Math.PI/180, r0=R+1, r1=R+8;
      const w=0.13;
      sp += `<path d="M${(cx+r0*Math.cos(a-w)).toFixed(1)} ${(cy+r0*Math.sin(a-w)).toFixed(1)}
             L${(cx+r1*Math.cos(a)).toFixed(1)} ${(cy+r1*Math.sin(a)).toFixed(1)}
             L${(cx+r0*Math.cos(a+w)).toFixed(1)} ${(cy+r0*Math.sin(a+w)).toFixed(1)} Z" fill="${m.ring}"/>`; }
    s += sp;
  } else if(tier === 4){                                 // 白金：六角のたて
    let hex=''; for(let i=0;i<6;i++){ const a=(i*60-90)*Math.PI/180;
      hex += `${(cx+(R+6)*Math.cos(a)).toFixed(1)},${(cy+(R+6)*Math.sin(a)).toFixed(1)} `; }
    s += `<polygon points="${hex}" fill="url(#g${u})" stroke="${m.ring}" stroke-width="1.6" opacity=".95"/>`;
  } else if(tier === 5){                                 // 金剛：切子のかがやき
    let oct=''; for(let i=0;i<8;i++){ const a=(i*45-90)*Math.PI/180;
      oct += `${(cx+(R+7)*Math.cos(a)).toFixed(1)},${(cy+(R+7)*Math.sin(a)).toFixed(1)} `; }
    s += `<polygon points="${oct}" fill="url(#g${u})" stroke="${m.ring}" stroke-width="1.6"/>`;
    for(let i=0;i<8;i++){ const a=(i*45-90)*Math.PI/180;
      s += `<line x1="${cx}" y1="${cy}" x2="${(cx+(R+7)*Math.cos(a)).toFixed(1)}" y2="${(cy+(R+7)*Math.sin(a)).toFixed(1)}"
             stroke="#fff" stroke-width=".8" opacity=".45"/>`; }
  } else if(tier === 6){                                 // 伝説：星芒と冠
    let st=''; for(let i=0;i<12;i++){ const r=i%2?R+4:R+15, a=(i*30-90)*Math.PI/180;
      st += `${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)} `; }
    s += `<polygon points="${st}" fill="${GOLD}" opacity=".9"/>
          <path d="M${cx-13} ${cy-R-6} L${cx-15} ${cy-R-19} L${cx-6} ${cy-R-12} L${cx} ${cy-R-23}
                   L${cx+6} ${cy-R-12} L${cx+15} ${cy-R-19} L${cx+13} ${cy-R-6} Z"
                fill="${GOLD2}" stroke="${GOLD}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  // 本体
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#g${u})" stroke="${m.ring}" stroke-width="2"/>
        <circle cx="${cx}" cy="${cy}" r="${R-4.5}" fill="none" stroke="${m.c}" stroke-width=".9" opacity=".55"/>
        <path d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy} Z" fill="url(#h${u})" opacity=".55"/>
        <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="central" font-family="var(--disp)"
          font-size="${(R*0.98).toFixed(0)}" font-weight="600" fill="${m.c}">${kanji}</text>
        <rect class="shine" x="-40" y="${cy-R}" width="26" height="${R*2}" fill="url(#w${u})" clip-path="url(#c${u})"/>`;
  // 完全位：月桂
  if(perfect){
    const lr = R + 13;
    for(const side of [-1,1]) for(let i=0;i<6;i++){
      const deg = 28 + i*23, a = (side<0 ? 180-deg : deg) * Math.PI/180;
      const x = cx + lr*Math.cos(a), y = cy + lr*Math.sin(a);
      s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="5" ry="2.4" fill="${GOLD}" opacity=".92"
             transform="rotate(${(a*180/Math.PI + side*62).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
  }
  return s + '</svg>';
}
/* いまのウィンドウの位。「完全」は この15ライフで 一度も しくじっていないこと。
   挑戦中の1回は まだ しくじったと きまっていないので 数に入れない */
function currentRank(){
  const c = readCycle(), n = c.cleared.length;
  if(!n) return null;
  const inQuiz = !!(state && state.timer) && !$('scQuiz').classList.contains('hidden');
  const spent = MAX_LIVES - c.lives - (inQuiz ? 1 : 0);
  return {tier:n, perfect: spent === n};
}
function readRetained(){
  let r = null;
  try { r = JSON.parse(localStorage.getItem('md_rank')||'null'); } catch(e){}
  if(!r || !r.tier || !r.until || Date.now() >= r.until) return null;
  return {tier:r.tier, perfect:!!r.perfect, until:r.until};
}
/* とどいた位を 記録に のこす。
   低ければ そのまま／高ければ 入れかえ／同じなら いまを起点に 数えなおし */
function saveRetained(tier, perfect){
  const days = keepDays(tier, perfect);
  if(!days) return;                                   // 銀以下は のこらない
  const cur = readRetained();
  if(cur && rankScore({tier,perfect}) < rankScore(cur)) return;
  try { localStorage.setItem('md_rank',
    JSON.stringify({tier:tier, perfect:!!perfect, until:Date.now()+days*86400000})); } catch(e){}
}
const rankScore = r => r ? r.tier*2 + (r.perfect?1:0) : -1;
function shownRank(){
  const a = currentRank(), b = readRetained();
  return rankScore(a) >= rankScore(b) ? a : b;
}

/* 位の表示。上のバー（どの画面でも見える）と、最初の画面の大きな札 */
let rankShown = '';
/* 手で閉じるまで ずっと出ている 成就ページ */
function showAchievement(r){
  $('achArt').innerHTML = rankBadge(r.tier, r.perfect);
  const nm = L(UI.rankName(r.tier, r.perfect));
  $('achTitle').textContent = L(UI.achTitle);
  $('achName').textContent = nm;
  $('achBody').textContent = L(UI.achBody(nm));
  const d = keepDays(r.tier, r.perfect);
  $('achKeep').textContent = d ? L(UI.achKeep(d)) : L(UI.achKeepNone);
  $('achOk').textContent = L(UI.achOk);
  $('ach').classList.remove('hidden');
}
$('achOk').onclick = () => { $('ach').classList.add('hidden'); if(state) state.rankEarned = null; };

function drawRank(){
  const r = shownRank(), c = readCycle();
  document.documentElement.dataset.rank = rankTheme(r) || '';
  if(!rankTheme(r)) document.documentElement.removeAttribute('data-rank');
  const key = r ? r.tier+'/'+(r.perfect?1:0) : 'none';
  const chip = $('rankChip'), panel = $('rankPanel');
  if(key !== rankShown){                        // 絵は変わったときだけ描きなおす
    rankShown = key;
    $('rankChipArt').innerHTML = r ? rankBadge(r.tier, r.perfect) : '';
    $('rankArt').innerHTML     = r ? rankBadge(r.tier, r.perfect) : '';
  }
  chip.classList.toggle('none', !r);
  chip.classList.toggle('pf', !!(r && r.perfect));
  chip.classList.toggle('dv', isDivine(r));
  panel.classList.toggle('none', !r);
  panel.classList.toggle('pf', !!(r && r.perfect));
  panel.classList.toggle('dv', isDivine(r));
  $('rankLab').textContent = L(UI.rankLab);
  if(!r){
    $('rankChipName').textContent = L(UI.rankNone);
    $('rankName').textContent = L(UI.rankNone);
    $('rankSub').textContent = L(UI.rankNoneHint);
    $('rankKeep').textContent = '';
    return;
  }
  const nm = L(UI.rankName(r.tier, r.perfect));
  $('rankChipName').textContent = nm;
  $('rankName').textContent = nm;
  // 説明は いまのウィンドウで とっている位のほう、日数は のこしてある記録のほうを見る
  const kept = readRetained(), cur = currentRank();
  $('rankSub').textContent = (cur && rankScore(cur) >= rankScore(kept))
    ? (r.perfect ? L(UI.perfectNote) : L(UI.rankProg(c.cleared.length)))
    : L(UI.heldRank);
  if(kept && rankScore(kept) >= rankScore(cur)){
    const ms = kept.until - Date.now();
    $('rankKeep').textContent = L(UI.keepFor(Math.floor(ms/86400000), Math.floor(ms/3600000)%24));
  } else {
    $('rankKeep').textContent = L(UI.keepNone);
  }
}

let gateWs = null;
function drawGate(){
  const c = readCycle(), g = globalLock(), u = untilRenew();
  // 開いたまま renew をまたいだら、画面を作りなおす。
  // 印をさきに更新しないと drawStart→drawGate で無限に呼び合う
  const rolled = gateWs !== null && gateWs !== c.ws;
  gateWs = c.ws;
  if(rolled && !$('scStart').classList.contains('hidden')) drawStart();
  drawRank();
  $('gLives').textContent = L(UI.lives);
  $('gRenew').textContent = L(UI.renewIn);
  $('gCnt').textContent = c.lives + ' / ' + MAX_LIVES;
  $('gCd').textContent = L(UI.hm(u.h,u.m));
  $('gate').classList.toggle('locked', !!g);
  const hs = $('gHearts'); hs.innerHTML = '';
  for(let i=0;i<MAX_LIVES;i++){ const d=document.createElement('i'); if(i>=c.lives) d.className='off'; hs.appendChild(d); }
  // 全部止まるとき（ライフ切れ・6学年制覇）は朱、一部の学年だけなら みどりの おしらせ
  const box = $('lock');
  box.classList.remove('notice');
  box.classList.toggle('hidden', !g && c.cleared.length===0);
  if(g === 'empty'){
    $('lockT').textContent = L(UI.lockedEmptyTitle); $('lockB').textContent = L(UI.lockedEmptyBody);
  } else if(g === 'all'){
    $('lockT').textContent = L(UI.lockedAllTitle); $('lockB').textContent = L(UI.lockedAllBody);
  } else if(c.cleared.length){
    box.classList.add('notice');
    $('lockT').textContent = L(UI.lockedSomeTitle);
    $('lockB').textContent = L(UI.lockedSomeBody(clearedNames()));
  }
  document.querySelectorAll('#grades .tile').forEach(t => {
    const n = +t.dataset.grade, lk = lockState(n);
    t.disabled = !!lk;
    t.classList.toggle('done', lk === 'cleared');
  });
  $('startBtn').disabled = picked===null || !!lockState(picked);
  $('sHint').textContent = g ? L(UI.renewIn)+' '+L(UI.hm(u.h,u.m)) : L(UI.gateHint);
  $('qLives').textContent = '♥ ' + c.lives;
  if(!$('scResult').classList.contains('hidden') && state)
    $('againBtn').disabled = !!lockState(state.grade);
  if(!$('cele').classList.contains('hidden') && state)
    $('celeRenew').textContent = L(UI.celeLock(L(UI.gradeN(state.grade))))+'\n'+L(UI.hm(u.h,u.m));
}
setInterval(drawGate, 15000);

/* ---------- log ---------- 直近15回は答案ごと保存し、あとから見返せる */
const KEEP = 15;
const readLog = () => { try { return JSON.parse(localStorage.getItem('md_log')||'[]'); }
                        catch(e){ return []; } };
function saveLog(){
  const {ms, hit, rank} = state.res;
  let l = readLog();
  l.unshift({g:state.grade, h:hit, s:Math.round(ms/1000), r:rank, d:Date.now(),
             base:state.base, qs:state.qs, ans:state.ans});
  l = l.slice(0, KEEP);
  // 保存できない大きさなら、古い記録から落として入るところまで残す
  while(l.length){
    try { localStorage.setItem('md_log', JSON.stringify(l)); return; }
    catch(e){ l = l.slice(0, l.length-1); }
  }
  try { localStorage.removeItem('md_log'); } catch(e){}
}
function drawLog(){
  const l = readLog();
  $('logBox').classList.toggle('hidden', l.length===0);
  $('sLog').textContent = L(UI.logT);
  const tb = $('logRows'); tb.innerHTML = '';
  l.forEach((x,i)=>{
    const openable = Array.isArray(x.qs) && Array.isArray(x.ans) && x.qs.length>0;
    const d = new Date(x.d), tr = document.createElement('tr');
    tr.className = openable ? 'open' : '';
    tr.innerHTML = '<td></td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n"></td>';
    const c = tr.children;
    c[0].textContent = L(UI.gradeN(x.g));
    c[1].textContent = x.h + '/15';
    c[2].textContent = fmtTime(x.s*1000);
    c[3].textContent = x.r;
    c[4].textContent = (d.getMonth()+1) + '/' + d.getDate();
    if(openable){
      tr.tabIndex = 0; tr.setAttribute('role','button');
      tr.onclick = () => openAttempt(i);
      tr.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openAttempt(i); } };
    }
    tb.appendChild(tr);
  });
  $('logHint').textContent = l.some(x=>Array.isArray(x.qs)) ? L(UI.logHint) : '';
}
function openAttempt(i){
  const r = readLog()[i];
  if(!r || !Array.isArray(r.qs)) return;
  const ok = r.qs.map((q,k) => judge(q, r.ans[k]));
  const base = r.base || r.s || 1;
  state = {grade:r.g, qs:r.qs, ans:r.ans, base:base, timer:null, viewing:r.d,
           res:{ms:r.s*1000, ok:ok, hit:ok.filter(Boolean).length, ratio:r.s/base, rank:r.r}};
  show('scResult');
  paintResult();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- 通関ページ ---------- */
const GOLD = '#C9971F', GOLD2 = '#EFC65C';
const svgWrap = inner => `<svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
/* 花丸：先生が答案に描く、あの花のような二重丸 */
function petalPath(cx,cy,r,n){
  let d='';
  for(let i=0;i<n;i++){
    const a0=(i/n)*Math.PI*2-Math.PI/2, a1=((i+1)/n)*Math.PI*2-Math.PI/2;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const pr=r*Math.PI/n*0.98;
    d += (i===0?`M${x0.toFixed(1)} ${y0.toFixed(1)}`:'') + ` A${pr.toFixed(1)} ${pr.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  }
  return d+'Z';
}
const AWARDS = [
  () => svgWrap(   /* 花丸 */
    `<path class="draw" style="--len:900" d="${petalPath(100,100,74,9)}" stroke="var(--shu)" stroke-width="7"/>
     <circle class="draw d2" style="--len:330" cx="100" cy="100" r="52" stroke="var(--shu)" stroke-width="6"/>
     <circle class="draw d3" style="--len:200" cx="100" cy="100" r="31" stroke="var(--shu)" stroke-width="5"/>`),
  () => svgWrap(   /* 金メダル */
    `<path class="pop" d="M74 26 L100 96 L60 96 Z" fill="${GOLD2}" opacity=".55"/>
     <path class="pop" d="M126 26 L140 96 L100 96 Z" fill="${GOLD}" opacity=".55"/>
     <circle class="pop d2" cx="100" cy="126" r="54" fill="${GOLD2}" stroke="${GOLD}" stroke-width="6"/>
     <circle class="pop d2" cx="100" cy="126" r="40" fill="none" stroke="${GOLD}" stroke-width="2.5" opacity=".7"/>
     <text class="pop d2" x="100" y="126" text-anchor="middle" dominant-baseline="central"
       font-family="var(--disp)" font-size="42" font-weight="600" fill="#7A5A0B" stroke="none">1</text>`),
  () => svgWrap(   /* 王冠 */
    `<path class="draw" style="--len:800" d="M40 138 L30 62 L68 92 L100 44 L132 92 L170 62 L160 138 Z"
       stroke="${GOLD}" stroke-width="7" fill="${GOLD2}" fill-opacity=".28"/>
     <path class="draw d2" style="--len:160" d="M40 152 L160 152" stroke="${GOLD}" stroke-width="7"/>
     <circle class="pop d2" cx="100" cy="44" r="9" fill="var(--shu)"/>`),
  () => svgWrap(   /* 「満点」の判子 */
    `<g class="stamp">
       <rect x="34" y="34" width="132" height="132" rx="10" fill="none" stroke="var(--shu)" stroke-width="8"/>
       <text x="100" y="83" text-anchor="middle" dominant-baseline="central" font-family="var(--disp)"
         font-size="52" font-weight="600" fill="var(--shu)" stroke="none">満</text>
       <text x="100" y="135" text-anchor="middle" dominant-baseline="central" font-family="var(--disp)"
         font-size="52" font-weight="600" fill="var(--shu)" stroke="none">点</text>
     </g>`),
  () => svgWrap(   /* 三重丸 */
    `<circle class="draw" style="--len:490" cx="100" cy="100" r="78" stroke="var(--shu)" stroke-width="7"/>
     <circle class="draw d2" style="--len:350" cx="100" cy="100" r="55" stroke="var(--shu)" stroke-width="6"/>
     <circle class="draw d3" style="--len:210" cx="100" cy="100" r="33" stroke="var(--shu)" stroke-width="5"/>`),
  () => {          /* 星章 */
    let d='M';
    for(let i=0;i<10;i++){ const r=i%2?32:78, a=(i/10)*Math.PI*2-Math.PI/2;
      d += `${(100+r*Math.cos(a)).toFixed(1)} ${(100+r*Math.sin(a)).toFixed(1)} `; }
    return svgWrap(
      `<path class="draw" style="--len:760" d="${d}Z" stroke="${GOLD}" stroke-width="7" fill="${GOLD2}" fill-opacity=".3"/>
       <circle class="pop d2" cx="100" cy="100" r="15" fill="var(--shu)"/>`); }
];

let celeFx = null;
function confetti(){
  const cv = $('celeFx'), ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr;
  ctx.scale(dpr,dpr);
  const W = cv.clientWidth, H = cv.clientHeight;
  const cols = ['#C3402B','#27467C','#3D7551',GOLD,GOLD2,'#5C8AC4'];
  // 上端のすぐ上から降らせる。散らしすぎると 画面に入る前に 終わってしまう
  const bits = Array.from({length:140}, () => ({
    x: Math.random()*W, y: -20-Math.random()*H*0.35,
    w: 5+Math.random()*7, h: 8+Math.random()*10,
    vy: 2.2+Math.random()*3.2, vx: (Math.random()-.5)*1.6,
    a: Math.random()*Math.PI, va: (Math.random()-.5)*0.22,
    c: cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0 = performance.now();
  cancelAnimationFrame(celeFx);
  (function frame(now){
    const age = now-t0;
    ctx.clearRect(0,0,W,H);
    bits.forEach(b=>{
      b.x+=b.vx; b.y+=b.vy; b.a+=b.va; b.vy+=0.02;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.a);
      ctx.globalAlpha = age>3600 ? Math.max(0,1-(age-3600)/1200) : 1;
      ctx.fillStyle = b.c; ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      ctx.restore();
    });
    if(age<4800) celeFx = requestAnimationFrame(frame);
    else ctx.clearRect(0,0,W,H);
  })(t0);
}
function celebrate(){
  const {ms, rank} = state.res;
  $('celeArt').innerHTML = P(AWARDS)();
  $('celeTitle').textContent = L(UI.celeTitle);
  $('celeWord').textContent = L(UI.celeWord());
  $('celeK1').textContent = L(UI.L2);   $('celeV1').textContent = fmtTime(ms);
  $('celeK2').textContent = L(UI.L1);   $('celeV2').textContent = '15/15';
  $('celeRank').classList.add('hidden');   // 位は このあとの 成就ページで きちんと出す
  $('celeBtn').textContent = L(UI.celeSee);
  $('celeRenew').textContent = L(UI.celeLock(L(UI.gradeN(state.grade))))+'\n'+renewText();
  $('cele').classList.remove('hidden');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) confetti();
}
/* 通関ページ → 成就ページ → 採点ページ の順に見せる */
$('celeBtn').onclick = () => {
  cancelAnimationFrame(celeFx);
  $('cele').classList.add('hidden');
  if(state && state.rankEarned) showAchievement(state.rankEarned);
};

/* ---------- screens ---------- */
function show(id){
  ['scStart','scQuiz','scResult'].forEach(s=>$(s).classList.toggle('hidden', s!==id));
}
let picked = null;
function drawStart(){
  $('sTitle').textContent = L(UI.title);
  $('sSub').textContent = L(UI.sub);
  $('sPick').textContent = L(UI.pick);
  $('startBtn').textContent = L(UI.start);
  $('sHint').textContent = L(UI.hint);
  $('againBtn').textContent = L(UI.again);
  $('againBtn').disabled = !state || !!lockState(state.grade);
  $('homeBtn').textContent = L(UI.home);
  $('brandEn').textContent = '15 questions';
  $('sFoot').textContent = L(UI.foot);
  if(picked && lockState(picked)) picked = null;   // 選んでいた学年が使えなくなったら外す
  const cleared = readCycle().cleared;
  const g = $('grades'); g.innerHTML='';
  for(let n=1;n<=6;n++){
    const b = document.createElement('button');
    b.type='button'; b.className='tile'; b.dataset.grade = n;
    b.setAttribute('aria-pressed', picked===n);
    b.innerHTML = '<span class="num">'+'一二三四五六'[n-1]+'</span><span><span class="tname"></span>'
      + '<span class="tdesc"></span></span>'
      + (cleared.includes(n) ? '<span class="clr"></span>' : '');
    b.querySelector('.tname').textContent = L(UI.gradeN(n));
    b.querySelector('.tdesc').textContent = L(GRADE_DESC[n]);
    if(cleared.includes(n)) b.querySelector('.clr').textContent = L(UI.clearedTag);
    b.onclick = ()=>{ if(lockState(n)) return; picked = n; drawStart(); };
    g.appendChild(b);
  }
  $('startBtn').disabled = picked===null;
  drawLog();
  drawGate();
}

function buildLangs(el){
  el.innerHTML = '';
  LANGS.forEach(([code,label])=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lg'; b.textContent = label;
    b.setAttribute('aria-pressed', code===LANG);
    b.onclick = e => { e.stopPropagation(); setLang(code); };
    el.appendChild(b);
  });
}
function applyLang(){
  document.documentElement.lang = LANG==='ja' ? 'ja' : LANG==='zh' ? 'zh-CN' : 'en';
  buildLangs($('langsTop')); buildLangs($('langsSplash'));
  $('spMsg1').textContent = L(UI.msg1);
  $('spMsg2').textContent = L(UI.msg2);
  $('spSkip').textContent = L(UI.skip);
}
function setLang(code){
  if(code === LANG) return;
  LANG = code;
  localStorage.setItem('md_lang', LANG);
  applyLang();
  drawStart();
  if(state && !$('scQuiz').classList.contains('hidden')) renderQ();
  if(state && state.res && !$('scResult').classList.contains('hidden')) paintResult();
  if(state && state.res && !$('cele').classList.contains('hidden')) celebrate();
  if(state && state.rankEarned && !$('ach').classList.contains('hidden')) showAchievement(state.rankEarned);
  drawGate();
  if(!$('splash').classList.contains('out')) restartSplashTimer();  // 読む時間を返す
}

/* ---------- 欢迎载入页 ---------- */
let splashTimer = null;
function closeSplash(){
  clearTimeout(splashTimer);
  $('splash').classList.add('out');
}
function restartSplashTimer(){
  clearTimeout(splashTimer);
  splashTimer = setTimeout(closeSplash, 3800);
  const bar = document.querySelector('.splash-bar i');
  bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
}
$('splash').onclick = closeSplash;
$('spSkip').onclick = closeSplash;
document.addEventListener('keydown', () => {
  if(!$('splash').classList.contains('out')) closeSplash();
});
$('startBtn').onclick = ()=> { if(picked && !lockState(picked)) startQuiz(picked); };
$('nextBtn').onclick = nextQ;
$('againBtn').onclick = ()=>{ if(state && !lockState(state.grade)) startQuiz(state.grade); };
$('homeBtn').onclick = ()=>{ show('scStart'); drawStart(); };
document.addEventListener('keydown', e=>{
  if($('scQuiz').classList.contains('hidden')) return;
  const q = state.qs[state.i];
  if(q.kind==='choice'){
    if(/^[1-4]$/.test(e.key) && +e.key<=q.opts.length){ state.ans[state.i]=+e.key-1; renderQ(); }
    else if(e.key==='Enter') nextQ();
  }
});
applyLang();
drawStart();
restartSplashTimer();
</script>
