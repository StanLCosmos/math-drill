<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stanのドリル — 中学受験レベルの算数 15問</title>
<meta name="description" content="Stanのドリル：日本の小学1〜6年生むけ算数ドリル。学年をえらぶと難関私立中の入試レベルの問題を15問、毎回ランダムに出題します。自動採点とタイム計測つき。日本語／中文／English。">
<meta property="og:type" content="website">
<meta property="og:title" content="Stanのドリル — 中学受験レベルの算数 15問">
<meta property="og:description" content="学年をえらぶだけ。毎回ちがう15問、自動採点とスピード判定つき。日本語／中文／English。">
<meta name="theme-color" content="#27467C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#EFF2F7;
  --card:#FFFFFF;
  --card-2:#F7F9FC;
  --ink:#161E29;
  --ink-soft:#57637A;
  --ink-faint:#8A94A6;
  --rule:#D4DAE5;
  --ai:#27467C;
  --ai-2:#5C8AC4;
  --ai-wash:#E3EAF5;
  --shu:#C3402B;
  --shu-wash:#F7E3DF;
  --matcha:#3D7551;
  --matcha-wash:#E1EFE5;
  --shadow:0 1px 2px rgba(22,30,41,.06),0 8px 24px -12px rgba(22,30,41,.18);
  --disp:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Songti SC","Noto Serif JP",serif;
  --body:"Hiragino Sans","Yu Gothic",YuGothic,"PingFang SC","Noto Sans JP",system-ui,sans-serif;
  --data:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111721;--card:#19202B;--card-2:#1F2734;--ink:#E8EDF5;--ink-soft:#98A4B8;
    --ink-faint:#6E7A8D;--rule:#2B3543;--ai:#8FB2E6;--ai-2:#6C93CC;--ai-wash:#1E2A3D;
    --shu:#E97961;--shu-wash:#3A2220;--matcha:#77C08E;--matcha-wash:#1D2E24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#111721;--card:#19202B;--card-2:#1F2734;--ink:#E8EDF5;--ink-soft:#98A4B8;
  --ink-faint:#6E7A8D;--rule:#2B3543;--ai:#8FB2E6;--ai-2:#6C93CC;--ai-wash:#1E2A3D;
  --shu:#E97961;--shu-wash:#3A2220;--matcha:#77C08E;--matcha-wash:#1D2E24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --paper:#EFF2F7;--card:#FFFFFF;--card-2:#F7F9FC;--ink:#161E29;--ink-soft:#57637A;
  --ink-faint:#8A94A6;--rule:#D4DAE5;--ai:#27467C;--ai-2:#5C8AC4;--ai-wash:#E3EAF5;
  --shu:#C3402B;--shu-wash:#F7E3DF;--matcha:#3D7551;--matcha-wash:#E1EFE5;
  --shadow:0 1px 2px rgba(22,30,41,.06),0 8px 24px -12px rgba(22,30,41,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}
.topbar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:26px}
.brand{font-family:var(--disp);font-size:22px;font-weight:600;letter-spacing:.04em}
.brand .en{font-family:var(--data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);margin-left:10px}
.spacer{flex:1}
.ghost{appearance:none;background:none;border:1px solid var(--rule);color:var(--ink-soft);
  font-family:var(--data);font-size:11px;letter-spacing:.1em;padding:5px 10px;border-radius:2px;cursor:pointer}
.ghost:hover{border-color:var(--ai);color:var(--ai)}
.ghost:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ai-2);outline-offset:2px}

/* ---- 言語スイッチ ---- */
.langs{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.lg{appearance:none;background:none;border:none;border-left:1px solid var(--rule);cursor:pointer;
  font-family:var(--data);font-size:11px;letter-spacing:.08em;padding:5px 9px;color:var(--ink-faint);
  transition:.13s}
.lg:first-child{border-left:none}
.lg:hover{color:var(--ai)}
.lg[aria-pressed="true"]{background:var(--ai);color:var(--paper)}
.lg:focus-visible{outline:2px solid var(--ai-2);outline-offset:-2px}

/* ---- 欢迎载入页 ---- */
.splash{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;
  padding:28px;text-align:center;transition:opacity .55s ease,visibility .55s}
.splash.out{opacity:0;visibility:hidden;pointer-events:none}
.splash-in{max-width:30rem;display:flex;flex-direction:column;align-items:center}
.seal{width:44px;height:44px;display:grid;place-items:center;border:2px solid var(--shu);
  border-radius:3px;color:var(--shu);font-family:var(--disp);font-size:24px;font-weight:600;
  transform:rotate(-6deg);margin-bottom:22px;animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
.brandmark{font-family:var(--disp);font-weight:600;font-size:clamp(32px,7.5vw,52px);letter-spacing:.09em;
  line-height:1.2;animation:rise .7s cubic-bezier(.2,.7,.3,1) .1s both}
.brandrule{width:56px;height:1px;background:var(--rule);margin:20px 0;
  animation:rise .7s cubic-bezier(.2,.7,.3,1) .22s both}
.splash-msg{margin:0;font-size:14.5px;line-height:1.75;color:var(--ink-soft);max-width:26rem;
  text-wrap:balance;animation:rise .7s cubic-bezier(.2,.7,.3,1) .3s both}
.splash-msg + .splash-msg{margin-top:12px;animation-delay:.42s}
.splash-bar{width:150px;height:2px;background:var(--rule);margin-top:32px;overflow:hidden;border-radius:2px}
.splash-bar i{display:block;height:100%;width:0;background:var(--ai);animation:fill 3.8s linear forwards}
.splash-skip{margin-top:16px;appearance:none;background:none;border:none;cursor:pointer;
  font-family:var(--data);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.splash-skip:hover{color:var(--ai)}
.splash .langs{margin-top:26px}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}to{width:100%}}

/* ---- 位（ランク）---- */
.badge{display:block;width:100%;height:100%;overflow:visible}
.badge .rays{transform-origin:50px 46px;animation:spin 26s linear infinite}
.badge .shine{animation:sweep 4.2s cubic-bezier(.5,0,.5,1) infinite}
.badge:not(.perfect) .shine{animation-duration:6.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%,55%{transform:translateX(0)}100%{transform:translateX(180px)}}

.rankchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:2px;
  padding:3px 9px 3px 5px;background:var(--card)}
.rankchip .bw{width:24px;height:24px;flex:none}
.rankchip .rn{font-family:var(--disp);font-size:12.5px;font-weight:600;letter-spacing:.05em;color:var(--ink)}
.rankchip.none{opacity:.55}
.rankchip.none .rn{font-family:var(--data);font-size:10.5px;letter-spacing:.12em;color:var(--ink-faint)}
.rankchip.pf{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-soft) inset,0 2px 10px -4px var(--gold)}
/* 神：金枠に ほのかな明滅 */
.rankchip.dv{border-color:var(--gold);background:linear-gradient(100deg,var(--card) 40%,rgba(201,151,31,.16));
  animation:glow 3.4s ease-in-out infinite}
.rankpanel.dv{border-color:var(--gold);background:linear-gradient(100deg,var(--card) 42%,rgba(201,151,31,.16))}
.rankpanel.dv .nm{font-size:30px;letter-spacing:.14em}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--gold-soft) inset,0 1px 8px -4px var(--gold)}
  50%{box-shadow:0 0 0 1px var(--gold-soft) inset,0 3px 16px -3px var(--gold)}}
.badge.divine .rays{transform-origin:50px 50px;animation-duration:44s}
:root{--gold:#C9971F;--gold-soft:#F2D479}

.rankpanel{display:flex;align-items:center;gap:18px;border:1px solid var(--rule);border-radius:3px;
  padding:16px 18px;margin-bottom:12px;background:var(--card)}
.rankpanel.pf{border-color:var(--gold);background:linear-gradient(100deg,var(--card) 55%,rgba(201,151,31,.09))}
.rankpanel .bw{width:74px;height:74px;flex:none}
.rankpanel .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.rankpanel .lab{font-family:var(--data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.rankpanel .nm{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:.06em;line-height:1.2}
.rankpanel.pf .nm{color:var(--gold)}
.rankpanel .sub{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.rankpanel .keep{font-family:var(--data);font-size:11.5px;color:var(--rk,var(--gold));letter-spacing:.03em}
.rankpanel.none .nm{color:var(--ink-faint);font-size:19px}

.cele-rank{display:flex;align-items:center;gap:12px;margin-top:20px;
  animation:rise .6s cubic-bezier(.2,.7,.3,1) 1.25s both}
.cele-rank .bw{width:52px;height:52px}
.cele-rank .t{display:flex;flex-direction:column;gap:2px;text-align:left}
.cele-rank .k{font-family:var(--data);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.cele-rank .v{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.05em;color:var(--ink)}
.cele-rank.pf .v{color:var(--gold)}

/* ---- 成就ページ ---- */
.ach{position:fixed;inset:0;z-index:70;background:var(--paper);display:grid;place-items:center;
  padding:28px;text-align:center;overflow:hidden}
.ach.hidden{display:none!important}
.ach::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 38%,var(--rk-wash,transparent) 0%,transparent 62%)}
.ach-in{position:relative;display:flex;flex-direction:column;align-items:center;max-width:30rem}
.ach-stage{position:relative;width:210px;height:210px;display:grid;place-items:center;margin-bottom:6px}
.ach-stage .ach-art{width:150px;height:150px;display:block}
.ach-stage .ring{position:absolute;border-radius:50%;border:1px dashed var(--rk,var(--ai-2));opacity:.5}
.ach-stage .r1{inset:6px;animation:spin 18s linear infinite}
.ach-stage .r2{inset:26px;border-style:dotted;opacity:.35;animation:spin 13s linear infinite reverse}
.ach-stage .halo{position:absolute;inset:18px;border-radius:50%;
  background:radial-gradient(circle,var(--rk-wash,rgba(0,0,0,.04)) 0%,transparent 70%);
  animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.12);opacity:1}}
.ach-t{font-family:var(--data);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-faint);margin:10px 0 0}
.ach-name{font-family:var(--disp);font-weight:600;font-size:clamp(34px,7vw,50px);letter-spacing:.12em;
  margin:6px 0 0;color:var(--rk,var(--ai))}
.ach-body{font-size:14.5px;color:var(--ink-soft);margin:12px 0 0;line-height:1.7}
.ach-keep{font-family:var(--data);font-size:12px;color:var(--rk,var(--ink-faint));margin:8px 0 0;letter-spacing:.03em}
.ach-in .btn{margin-top:28px;min-width:150px}

/* ---- 位ごとの意匠。完全金から上だけ、位が上がるほど こまやかに ---- */
:root[data-rank="gold"]    {--rk:#B7891B;--rk2:#F2D479;--rk-wash:rgba(201,151,31,.11)}
:root[data-rank="platinum"]{--rk:#71818F;--rk2:#D8E2EA;--rk-wash:rgba(113,129,143,.12)}
:root[data-rank="diamond"] {--rk:#2F87A4;--rk2:#BDEBF8;--rk-wash:rgba(47,135,164,.11)}
:root[data-rank="legend"]  {--rk:#B03A26;--rk2:#F0A88F;--rk-wash:rgba(176,58,38,.10)}
:root[data-rank="divine"]  {--rk:#A87A12;--rk2:#FFF1C9;--rk-wash:rgba(201,151,31,.16)}
:root[data-rank] .topbar{border-bottom-color:var(--rk)}
:root[data-rank] .rankpanel{border-color:var(--rk);
  background:linear-gradient(100deg,var(--card) 44%,var(--rk-wash))}
:root[data-rank] .rankpanel .nm{color:var(--rk)}
:root[data-rank] .rankchip{border-color:var(--rk)}
:root[data-rank] .eyebrow{color:var(--rk);opacity:.8}
/* 白金から：札の四隅に かざり */
:root[data-rank="platinum"] .rankpanel,:root[data-rank="diamond"] .rankpanel,
:root[data-rank="legend"] .rankpanel,:root[data-rank="divine"] .rankpanel{position:relative}
:root[data-rank="platinum"] .rankpanel::before,:root[data-rank="diamond"] .rankpanel::before,
:root[data-rank="legend"] .rankpanel::before,:root[data-rank="divine"] .rankpanel::before{
  content:"";position:absolute;inset:5px;pointer-events:none;
  border:1px solid var(--rk);opacity:.32;
  clip-path:polygon(0 0,22px 0,22px 1px,1px 1px,1px 22px,0 22px,0 0,
    100% 0,100% 22px,calc(100% - 1px) 22px,calc(100% - 1px) 1px,calc(100% - 22px) 1px,calc(100% - 22px) 0,100% 0,
    100% 100%,calc(100% - 22px) 100%,calc(100% - 22px) calc(100% - 1px),calc(100% - 1px) calc(100% - 1px),
    calc(100% - 1px) calc(100% - 22px),100% calc(100% - 22px),100% 100%,
    0 100%,0 calc(100% - 22px),1px calc(100% - 22px),1px calc(100% - 1px),22px calc(100% - 1px),22px 100%,0 100%)}
/* 金剛から：地に かすかな切子 */
:root[data-rank="diamond"] body,:root[data-rank="diamond"] .wrap::before{}
:root[data-rank="diamond"] body{background-image:
  repeating-linear-gradient(45deg,var(--rk-wash) 0 1px,transparent 1px 22px)}
/* 伝説から：麻の葉ふうの あじろ */
:root[data-rank="legend"] body{background-image:
  repeating-linear-gradient(60deg,var(--rk-wash) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(-60deg,var(--rk-wash) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(0deg,var(--rk-wash) 0 1px,transparent 1px 26px)}
/* 神：あじろに 御来光の かがやきを かさねる */
:root[data-rank="divine"] body{background-image:
  radial-gradient(circle at 50% -12%,rgba(201,151,31,.22) 0%,transparent 46%),
  repeating-linear-gradient(60deg,var(--rk-wash) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(-60deg,var(--rk-wash) 0 1px,transparent 1px 26px);
  background-attachment:fixed,scroll,scroll}
:root[data-rank="divine"] .card,:root[data-rank="divine"] .gate{border-color:rgba(201,151,31,.42)}
:root[data-rank="legend"] .card,:root[data-rank="legend"] .gate{border-color:rgba(176,58,38,.3)}

/* ---- ライフと renew ---- */
.gate{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;
  border:1px solid var(--rule);border-radius:3px;padding:13px 16px;margin-bottom:22px;
  background:var(--card)}
.gate.locked{border-color:var(--shu);background:var(--shu-wash)}
.gate .side{display:flex;align-items:baseline;gap:9px}
.gate .lab{font-family:var(--data);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint)}
.hearts{display:flex;gap:3px;align-items:center}
.hearts i{width:7px;height:7px;background:var(--shu);border-radius:50%;display:block}
.hearts i.off{background:var(--rule)}
.gate .cnt{font-family:var(--data);font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.gate .cd{font-family:var(--data);font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.gate.locked .cnt,.gate.locked .cd{color:var(--shu)}
.lock{border:1px solid var(--shu);background:var(--shu-wash);border-radius:3px;padding:18px 20px;
  margin-bottom:22px}
.lock h2{font-family:var(--disp);font-size:17px;margin:0 0 6px;color:var(--shu);letter-spacing:.03em}
.lock p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.lock.notice{border-color:var(--matcha);background:var(--matcha-wash)}
.lock.notice h2{color:var(--matcha)}
.tile[disabled],.tile[disabled]:hover{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;
  border-color:var(--rule)}
/* クリアした学年は「終わった」見た目に。使えないのではなく やりとげた印 */
.tile.done,.tile.done:hover{opacity:1;border-color:var(--matcha);background:var(--matcha-wash);
  cursor:default;transform:none;box-shadow:none}
.tile.done .num{border-color:var(--matcha);color:var(--matcha);background:transparent}
.tile.done .tname,.tile.done .tdesc{opacity:.62}
.tile{position:relative}
.clr{position:absolute;top:9px;right:10px;font-family:var(--data);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--matcha);border:1px solid var(--matcha);border-radius:2px;
  padding:2px 5px;line-height:1}
.qlives{display:flex;align-items:center;gap:6px;font-family:var(--data);font-size:12px;
  color:var(--shu);font-variant-numeric:tabular-nums}

/* ---- 通関ページ ---- */
.cele{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;
  padding:28px;text-align:center;overflow:hidden}
.cele.hidden{display:none!important}
.cele canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cele-in{position:relative;display:flex;flex-direction:column;align-items:center;max-width:28rem}
.cele-art{width:168px;height:168px;margin-bottom:8px}
.cele-art svg{width:100%;height:100%;overflow:visible}
.draw{stroke-dasharray:var(--len,1200);stroke-dashoffset:var(--len,1200);
  animation:stroke 1.1s cubic-bezier(.4,.1,.2,1) forwards}
.draw.d2{animation-delay:.5s}
.draw.d3{animation-delay:.85s}
.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.pop.d2{animation-delay:.35s}
.stamp{animation:stamp .45s cubic-bezier(.2,1.4,.35,1) both}
@keyframes stroke{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}60%{opacity:1;transform:scale(.92) rotate(-7deg)}
  100%{opacity:1;transform:scale(1) rotate(-7deg)}}
.cele-title{font-family:var(--disp);font-weight:600;font-size:clamp(30px,6.5vw,44px);letter-spacing:.1em;
  color:var(--shu);animation:rise .6s cubic-bezier(.2,.7,.3,1) .9s both}
.cele-word{font-family:var(--disp);font-size:18px;color:var(--ink);margin-top:10px;letter-spacing:.04em;
  animation:rise .6s cubic-bezier(.2,.7,.3,1) 1.05s both}
.cele-stats{display:flex;gap:22px;margin-top:22px;animation:rise .6s cubic-bezier(.2,.7,.3,1) 1.2s both}
.cele-stat{display:flex;flex-direction:column;gap:3px}
.cele-stat .k{font-family:var(--data);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint)}
.cele-stat .v{font-family:var(--data);font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cele-in .btn{margin-top:26px;animation:rise .6s cubic-bezier(.2,.7,.3,1) 1.35s both}
.cele-renew{font-size:12.5px;color:var(--ink-faint);margin:14px 0 0;line-height:1.7;
  animation:rise .6s cubic-bezier(.2,.7,.3,1) 1.5s both}

/* ---- フッター ---- */
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--rule);font-size:12.5px;
  color:var(--ink-faint);line-height:1.7}
.foot b{font-family:var(--disp);color:var(--ink-soft);font-weight:600}

.lede{font-family:var(--disp);font-size:clamp(28px,5vw,40px);line-height:1.3;margin:0 0 10px;
  text-wrap:balance;letter-spacing:.02em}
.sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 30px;max-width:56ch}

.eyebrow{font-family:var(--data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--rule);
  border-radius:3px;padding:16px 16px 14px;cursor:pointer;font-family:var(--body);color:var(--ink);
  transition:border-color .15s,transform .15s,box-shadow .15s;display:flex;gap:14px;align-items:flex-start}
.tile:hover{border-color:var(--ai-2);transform:translateY(-2px);box-shadow:var(--shadow)}

.loghint{font-size:12px;color:var(--ink-faint);margin:12px 0 0}
.rwhen{font-family:var(--data);font-size:12px;letter-spacing:.08em;color:var(--shu);

.sheet{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}

.answer{margin-top:22px}
.opts{display:grid;gap:8px}

.unit{font-family:var(--disp);font-size:17px;color:var(--ink-soft)}
.note{font-size:12.5px;color:var(--ink-faint);margin-top:10px}
.qfoot{display:flex;align-items:center;gap:14px;margin-top:24px;flex-wrap:wrap}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 8px}

.score .meta{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.rank{position:absolute;top:14px;right:16px;width:52px;height:52px;display:grid;place-items:center;

.bar{height:5px;background:var(--card-2);border-radius:3px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--ai)}
.review{margin-top:30px;display:grid;gap:10px}
.rv{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--matcha);

.hidden{display:none!important}

const SH = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const gcd = (a,b) => b ? gcd(b, a%b) : Math.abs(a);
const lcm = (a,b) => a/gcd(a,b)*b;
const num = n => { const r = Math.round(n*1e6)/1e6; return String(r); };
/* English article before a number: an 8, an 11, an 18, an 80 … otherwise a */
const AN = n => { const s = String(n); return (s[0]==='8' || s==='11' || s==='18') ? 'an' : 'a'; };
function fr(n,d){ const g=gcd(n,d)||1; n/=g; d/=g; if(d===1) return String(n); return n+'/'+d; }
function frMixed(n,d){ const g=gcd(n,d)||1; n/=g; d/=g; if(d===1) return String(n);
  if(n>d){ const w=Math.floor(n/d); return w+' '+(n-w*d)+'/'+d; } return n+'/'+d; }

/* question builders */
function QI(o){ // fill-in
  return {kind:'input', tag:o.tag, q:o.q, fig:o.fig||null, unit:o.unit||null,
          val:o.val, disp:o.disp!=null?String(o.disp):num(o.val), note:o.note||null,
          exp:o.exp, sec:o.sec};
}
function QC(o){ // multiple choice; o.opts = [text...], o.ci = index of correct
  const idx = SH(o.opts.map((_,i)=>i));
  return {kind:'choice', tag:o.tag, q:o.q, fig:o.fig||null,
          opts: idx.map(i=>o.opts[i]), ci: idx.indexOf(o.ci),
          exp:o.exp, sec:o.sec};
}
/* numeric answer parsing: 12, 3.5, 3/4, 1 1/2, １２ (full width), 12cm */
function parseNum(s){
  if(s==null) return null;
  let t = String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[．。]/g,'.').replace(/[／]/g,'/').replace(/[，,]/g,'')
    .replace(/と/g,' ').replace(/\s+/g,' ').trim();
  t = t.replace(/[^0-9./ -]/g,'').trim();
  if(!t) return null;
  let m = t.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if(m) return (+m[1]) + (m[1][0]==='-'?-1:1)*(+m[2])/(+m[3]);
  m = t.match(/^(-?\d+)\/(\d+)$/);
  if(m) return (+m[1])/(+m[2]);
  m = t.match(/^-?\d*\.?\d+$/);
  if(m) return parseFloat(t);
  return null;
}

    unit:G('分','分钟','minutes'),val:d,sec:35,
    exp:G(`${h}時${m}分から ${h+1}時までが ${60-m}分、そこから ${d-(60-m)}分。合わせて ${d}分。`,
          `先到整点 ${60-m} 分，再加 ${d-(60-m)} 分，共 ${d} 分钟。`,
          `${60-m} minutes to reach ${h+1}:00, then ${d-(60-m)} more — ${d} minutes in total.`)});},

()=>{ const a=R(6,9),b=R(4,8),e=R(3,9);
  return QI({tag:G('文しょうだい','应用题','Word problem'),q:G(`1はこに ${a}こ 入った クッキーが ${b}はこ あります。\nそのうち ${e}こ 食べました。\nクッキーは 何こ のこって いますか。`,
      `每盒 ${a} 块饼干，共 ${b} 盒，吃掉 ${e} 块。还剩多少块？`,
      `There are ${b} boxes of biscuits with ${a} in each box.\n${e} biscuits have been eaten.\nHow many biscuits are left?`),
    unit:G('こ','块','biscuits'),val:a*b-e,sec:35,
    exp:G(`${a}×${b}=${a*b}こ から ${e}こ ひいて ${a*b-e}こ。`,`${a}×${b}=${a*b}，减 ${e} 得 ${a*b-e} 块。`,
          `${a}×${b}=${a*b} in total, minus ${e} eaten, leaves ${a*b-e}.`)});},

()=>{ const p=R(3,4),cj=['赤','青','黄','緑'].slice(0,p),cz=['红','蓝','黄','绿'].slice(0,p),
        ce=['red','blue','yellow','green'].slice(0,p);
  const n=R(23,68),k=(n-1)%p;
  return QC({tag:G('きまり','周期规律','Repeating pattern'),q:G(`ボールを ${cj.join('・')} の じゅんに くりかえし ならべます。\n左から ${n}番目の ボールは 何色ですか。`,
      `按 ${cz.join('、')} 的顺序循环排列小球。从左数第 ${n} 个是什么颜色？`,
      `Balls are laid out repeating the order ${ce.join(', ')}.\nWhat colour is the ${n}th ball from the left?`),
    opts:cj.map((c,i)=>G(c,cz[i],ce[i])),ci:k,sec:40,
    exp:G(`${p}個ごとの くりかえし。${n}÷${p}=${Math.floor(n/p)}あまり${n%p} なので ${k+1}番目の 色。`,
          `每 ${p} 个一循环，${n}÷${p}=${Math.floor(n/p)}余${n%p}，对应第 ${k+1} 个颜色。`,
          `The pattern repeats every ${p}. ${n}÷${p}=${Math.floor(n/p)} remainder ${n%p}, so it is the ${k+1}${['st','nd','rd','th'][Math.min(k,3)]} colour.`)});},

()=>{ const d=P([2,3,4,5]),n=R(6,12),len=d*n;
  return QI({tag:G('植木算','植树问题','Trees and gaps'),q:G(`まっすぐな 道の はしから はしまで、${d}mおきに 木を うえます。\n道の 長さが ${len}m のとき、木は 何本 いりますか。`,
      `在一条直路上从头到尾每隔 ${d} 米种一棵树。路长 ${len} 米，需要多少棵树？`,
      `Trees are planted every ${d}m along a straight road, from one end to the other.\nThe road is ${len}m long. How many trees are needed?`),
    unit:G('本','棵','trees'),val:n+1,sec:40,
    exp:G(`間の数は ${len}÷${d}=${n}。両はしにも うえるので 木は ${n}+1=${n+1}本。`,
          `间隔数 ${len}÷${d}=${n}，两端都种，树 = 间隔数 + 1 = ${n+1} 棵。`,
          `There are ${len}÷${d}=${n} gaps. Both ends get a tree, so trees = gaps + 1 = ${n+1}.`)});},

()=>{ const d=P([2,3,4,8]);
  const opts=[2,3,4,8],ci=opts.indexOf(d);
  const w={2:'half',3:'a third',4:'a quarter',8:'an eighth'};
  return QC({tag:G('分数','分数','Fractions'),q:G(`ケーキを 同じ 大きさに ${d}つに 分けました。\nその 1つ分は、もとの 大きさの どれだけですか。`,
      `把一个蛋糕平均分成 ${d} 份，其中 1 份是原来的多少？`,
      `A cake is cut into ${d} equal pieces.\nOne piece is how much of the whole cake?`),
    opts:opts.map(x=>G(`${x}分の1`,`${x} 分之一`,w[x])),ci:ci,sec:25,
    exp:G(`同じ 大きさに ${d}つに 分けた 1つ分だから ${d}分の1。`,`平均分成 ${d} 份，一份就是 ${d} 分之一。`,
          `Cut into ${d} equal parts, one part is ${w[d]}.`)});},

()=>{ const set=P([
   {q:G('四角形に ついて、正しい ものは どれですか。','关于四边形，下面哪句话是对的？','Which statement about a quadrilateral is true?'),
    o:[G('へんが 4本 ある','有 4 条边','It has 4 sides'),G('かどが 3つ ある','有 3 个角','It has 3 corners'),
       G('三角形より へんが 少ない','边比三角形少','It has fewer sides than a triangle'),G('へんは かならず 同じ 長さ','四条边一定一样长','All four sides must be equal')],c:0,
    e:G('四角形は へんが4本、かどが4つ ある形です。','四边形有 4 条边 4 个角，边不一定等长。','A quadrilateral has 4 sides and 4 corners; the sides need not be equal.')},
   {q:G('長方形に ついて、正しい ものは どれですか。','关于长方形，下面哪句话是对的？','Which statement about a rectangle is true?'),
    o:[G('4つの かどが みんな 直角','四个角都是直角','All four corners are right angles'),G('へんが 3本','有 3 条边','It has 3 sides'),
       G('4つの へんが みんな 同じ 長さ','四条边都相等','All four sides are equal'),G('直角は 2つ だけ','只有 2 个直角','It has exactly 2 right angles')],c:0,
    e:G('長方形は 4つの かどが すべて 直角。4辺が 等しい ものは 正方形です。','长方形四个角都是直角；四边都相等的是正方形。','A rectangle has four right angles; the one with four equal sides is a square.')}]);
  return QC({tag:G('図形','图形','Shapes'),q:set.q,opts:set.o,ci:set.c,sec:30,exp:set.e});},

()=>{ const t=P([0,1]),n=R(7,10);
  if(t===0){ const v=n*(n+1)/2;
    return QI({tag:G('数のきまり','数列规律','Number pattern'),q:G(`1、3、6、10、15、… と ならんで います。\n${n}番目の 数は いくつですか。`,
        `1、3、6、10、15、… 按此规律排列。第 ${n} 个数是多少？`,
        `The numbers go 1, 3, 6, 10, 15, …\nWhat is the ${n}th number?`),val:v,sec:45,
      exp:G(`ふえ方が 2、3、4、… です。1から ${n}までを たして ${v}。`,`每次增加 2、3、4…，即 1+2+…+${n}=${v}。`,
            `The jumps are 2, 3, 4, …, so it is 1+2+…+${n}=${v}.`)});}
  const a=R(2,6),d=R(3,7),v=a+d*(n-1);
  return QI({tag:G('数のきまり','数列规律','Number pattern'),q:G(`${a}、${a+d}、${a+2*d}、${a+3*d}、… と ならんで います。\n${n}番目の 数は いくつですか。`,
      `${a}、${a+d}、${a+2*d}、${a+3*d}、… 按此规律排列。第 ${n} 个数是多少？`,
      `The numbers go ${a}, ${a+d}, ${a+2*d}, ${a+3*d}, …\nWhat is the ${n}th number?`),val:v,sec:40,
    exp:G(`${d}ずつ ふえるので ${a}+${d}×${n-1}=${v}。`,`每次加 ${d}：${a}+${d}×${n-1}=${v}。`,`It rises by ${d} each time: ${a}+${d}×${n-1}=${v}.`)});},

()=>{ const b=R(27,58),ans=R(30,60);
  return P([0,1])===0
    ? QI({tag:G('虫くい算','填空计算','Missing number'),q:G(`□に あてはまる 数を 答えましょう。\n\n[[□ − ${b} = ${ans}]]`,`求 □：\n\n[[□ − ${b} = ${ans}]]`,`Find the missing number.\n\n[[□ − ${b} = ${ans}]]`),
        val:ans+b,sec:25,exp:G(`${ans}+${b}=${ans+b}。`,`${ans}+${b}=${ans+b}。`,`${ans}+${b}=${ans+b}.`)})
    : QI({tag:G('虫くい算','填空计算','Missing number'),q:G(`□に あてはまる 数を 答えましょう。\n\n[[${b} + □ = ${b+ans}]]`,`求 □：\n\n[[${b} + □ = ${b+ans}]]`,`Find the missing number.\n\n[[${b} + □ = ${b+ans}]]`),
        val:ans,sec:25,exp:G(`${b+ans}−${b}=${ans}。`,`${b+ans}−${b}=${ans}。`,`${b+ans}−${b}=${ans}.`)});},

()=>{ const p=P([20,30,40,50]),n=R(4,9),tot=p*n;
  return QI({tag:G('文しょうだい','应用题','Word problem'),q:G(`1本 ${p}円の えんぴつを 何本か 買って、ちょうど ${tot}円 はらいました。\nえんぴつを 何本 買いましたか。`,
      `每支 ${p} 日元的铅笔，一共付了 ${tot} 日元。买了几支？`,
      `Pencils cost ${p} yen each. You paid exactly ${tot} yen.\nHow many pencils did you buy?`),
    unit:G('本','支','pencils'),val:n,sec:30,
    exp:G(`${p}を 何回 たすと ${tot}に なるかを 考えて ${n}本。`,`${tot}÷${p}=${n} 支。`,`How many ${p}s make ${tot}? ${tot}÷${p}=${n}.`)});},

()=>{ let a,b,c,d;
  do{ a=R(4,9);b=R(4,9);c=R(4,9);d=R(4,9);}while(a*b===c*d);
  const v1=a*b,v2=c*d,ci=v1>v2?0:1;
  return QC({tag:G('九九','乘法比较','Times tables'),q:G(`${a}×${b} と ${c}×${d} では、どちらが 大きいですか。`,`${a}×${b} 和 ${c}×${d} 哪个大？`,`Which is bigger, ${a}×${b} or ${c}×${d}?`),
    opts:[G(`${a}×${b}`,`${a}×${b}`,`${a}×${b}`),G(`${c}×${d}`,`${c}×${d}`,`${c}×${d}`),G('同じ','一样大','They are equal'),G('くらべられない','无法比较','You cannot tell')],ci:ci,sec:30,
    exp:G(`${a}×${b}=${v1}、${c}×${d}=${v2}。`,`${a}×${b}=${v1}，${c}×${d}=${v2}。`,`${a}×${b}=${v1} and ${c}×${d}=${v2}.`)});}
);

const WJ=['日','月','火','水','木','金','土'], WZ=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'],
      WE=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
BANK[3].push(
()=>{ const cap=R(4,8),n=cap*R(6,14)+R(1,cap-1),t=Math.ceil(n/cap);
  return QI({tag:G('わり算とあまり','除法与余数','Division with remainder'),q:G(`${n}人の 子どもが、1台に ${cap}人まで 乗れる ゴンドラに 乗ります。\n全員が 乗るには ゴンドラは 何台 いりますか。`,
      `${n} 个小朋友要坐缆车，每台最多坐 ${cap} 人。全部坐下至少需要几台？`,
      `${n} children are riding cable cars that hold up to ${cap} people each.\nHow many cars are needed for everyone?`),
    unit:G('台','台','cars'),val:t,sec:40,
    exp:G(`${n}÷${cap}=${Math.floor(n/cap)}あまり${n%cap}。あまった ${n%cap}人にも 1台 いるので ${t}台。`,
          `${n}÷${cap}=${Math.floor(n/cap)}余${n%cap}，余下的 ${n%cap} 人还要 1 台，共 ${t} 台。`,
          `${n}÷${cap}=${Math.floor(n/cap)} remainder ${n%cap}. The last ${n%cap} still need a car, so ${t}.`)});},

()=>{ const a=R(23,89),k=P([10,100]),v=a*k*10;
  return QI({tag:G('大きな数','大数','Large numbers'),q:G(`${v} を ${k}で わった 数は いくつですか。`,`${v} 除以 ${k} 得多少？`,`What is ${v} divided by ${k}?`),
    val:v/k,sec:30,exp:G(`${k}で わると くらいが ${String(k).length-1}つ 下がるので ${v/k}。`,
      `除以 ${k}，各数位下降 ${String(k).length-1} 位，得 ${v/k}。`,
      `Dividing by ${k} shifts every digit ${String(k).length-1} place down: ${v/k}.`)});},

()=>{ let a,b; do{ a=R(15,89); b=R(15,89); }while(a%10===0||b%10===0||(a+b)%10===0);
  return P([0,1])===0
    ? QI({tag:G('小数','小数','Decimals'),q:G(`つぎの 計算を しましょう。\n\n[[${a/10} + ${b/10}]]`,`计算：\n\n[[${a/10} + ${b/10}]]`,`Work this out.\n\n[[${a/10} + ${b/10}]]`),
        val:(a+b)/10,sec:30,exp:G(`小数点を そろえて たすと ${(a+b)/10}。`,`小数点对齐相加，得 ${(a+b)/10}。`,`Line up the decimal points and add: ${(a+b)/10}.`)})
    : QI({tag:G('小数','小数','Decimals'),q:G(`つぎの 計算を しましょう。\n\n[[${(a+b)/10} − ${b/10}]]`,`计算：\n\n[[${(a+b)/10} − ${b/10}]]`,`Work this out.\n\n[[${(a+b)/10} − ${b/10}]]`),
        val:a/10,sec:30,exp:G(`小数点を そろえて ひくと ${a/10}。`,`小数点对齐相减，得 ${a/10}。`,`Line up the decimal points and subtract: ${a/10}.`)});},

()=>{ const d=R(5,9),x=R(1,d-2),y=R(1,d-x-1);
  return QI({tag:G('分数','分数','Fractions'),q:G(`つぎの 計算を しましょう。答えは 分数で 書きましょう。\n\n[[${x}/${d} + ${y}/${d}]]`,
      `计算（用分数作答）：\n\n[[${x}/${d} + ${y}/${d}]]`,
      `Work this out. Give your answer as a fraction.\n\n[[${x}/${d} + ${y}/${d}]]`),
    val:(x+y)/d,disp:fr(x+y,d),note:UI.fracN,sec:30,
    exp:G(`分母は そのまま、分子を たして ${x+y}/${d}。`,`分母不变，分子相加得 ${x+y}/${d}。`,`Keep the denominator, add the numerators: ${x+y}/${d}.`)});},

()=>{ const kg=R(2,5),g=R(100,900),sub=R(150,900);
  const tot=kg*1000+g;
  return QI({tag:G('重さ','重量','Mass'),q:G(`${kg}kg${g}g の さとうから ${sub}g 使いました。\nのこりは 何g ですか。`,
      `${kg}kg${g}g 的糖用掉 ${sub}g，还剩多少克？`,
      `You start with ${kg}kg ${g}g of sugar and use ${sub}g.\nHow many grams are left?`),
    unit:G('g','g','g'),val:tot-sub,sec:35,
    exp:G(`1kg=1000g なので ぜんぶで ${tot}g。${tot}−${sub}=${tot-sub}g。`,`1kg=1000g，共 ${tot}g，减去 ${sub}g 得 ${tot-sub}g。`,
          `1kg=1000g, so you start with ${tot}g. ${tot}−${sub}=${tot-sub}g.`)});},

()=>{ const b=R(0,6),d=R(15,29),ci=(b+d-1)%7;
  const os=SH([0,1,2,3].map(k=>(ci+k*2)%7)).slice(0,4);
  const opts=Array.from(new Set([ci,...os])).slice(0,4);
  return QC({tag:G('きまり','周期规律','Repeating pattern'),q:G(`ある月の 1日は ${WJ[b]}曜日です。\nこの月の ${d}日は 何曜日ですか。`,
      `某月 1 号是${WZ[b]}。这个月的 ${d} 号是星期几？`,
      `The 1st of a month falls on a ${WE[b]}.\nWhat day of the week is the ${d}th?`),
    opts:opts.map(i=>G(WJ[i]+'曜日',WZ[i],WE[i])),ci:opts.indexOf(ci),sec:40,
    exp:G(`1日から ${d}日までは ${d-1}日 あと。${d-1}÷7=${Math.floor((d-1)/7)}あまり${(d-1)%7} なので ${WJ[b]}曜日から ${(d-1)%7}つ 進んで ${WJ[ci]}曜日。`,
          `相隔 ${d-1} 天，${d-1}÷7 余 ${(d-1)%7}，从${WZ[b]}往后 ${(d-1)%7} 天是${WZ[ci]}。`,
          `That is ${d-1} days later. ${d-1}÷7=${Math.floor((d-1)/7)} remainder ${(d-1)%7}, so move ${(d-1)%7} days on from ${WE[b]} to reach ${WE[ci]}.`)});},

()=>{ const r=R(3,7),n=R(3,5);
  return QI({tag:G('円','圆','Circles'),q:G(`半径 ${r}cm の 円を ${n}こ、となり どうし ぴったり つけて 横一列に ならべました。\nはしから はしまでの 長さは 何cm ですか。`,
      `把 ${n} 个半径 ${r}cm 的圆一个挨一个横排。从最左端到最右端长多少厘米？`,
      `${n} circles of radius ${r}cm are placed in a row, each just touching the next.\nHow long is the row from end to end, in cm?`),
    unit:G('cm','cm','cm'),val:2*r*n,sec:40,
    exp:G(`円 1こ分の はばは 直径 ${2*r}cm。${2*r}×${n}=${2*r*n}cm。`,`每个圆宽为直径 ${2*r}cm，${2*r}×${n}=${2*r*n}cm。`,
          `Each circle is one diameter wide, ${2*r}cm. ${2*r}×${n}=${2*r*n}cm.`)});},

()=>{ const s=P([
   {q:G('二等辺三角形に ついて、正しい ものは どれですか。','关于等腰三角形，下面哪句是对的？','Which statement about an isosceles triangle is true?'),
    o:[G('2つの 辺の 長さが 等しい','有两条边相等','Two of its sides are equal'),G('3つの 角が すべて 60度','三个角都是 60 度','All three angles are 60°'),
       G('かならず 直角が ある','一定有直角','It always has a right angle'),G('4つの 辺が ある','有四条边','It has four sides')],c:0,
    e:G('二等辺三角形は 2辺が 等しく、その 2つの 底角も 等しく なります。','等腰三角形有两条边相等，两底角也相等。','An isosceles triangle has two equal sides, and the two base angles are equal too.')},
   {q:G('正三角形に ついて、正しい ものは どれですか。','关于等边三角形，下面哪句是对的？','Which statement about an equilateral triangle is true?'),
    o:[G('3つの 角が すべて 60度','三个角都是 60 度','All three angles are 60°'),G('直角が 1つ ある','有一个直角','It has one right angle'),
       G('2つの 辺だけ 等しい','只有两条边相等','Only two sides are equal'),G('角の 大きさは ばらばら','三个角大小不一','The angles are all different')],c:0,
    e:G('正三角形は 3辺 3角が すべて 等しく、1つの 角は 180÷3=60度。','等边三角形三边三角都相等，每个角 180÷3=60 度。','All three sides and angles are equal, and each angle is 180÷3=60°.')}]);
  return QC({tag:G('図形','图形','Shapes'),q:s.q,opts:s.o,ci:s.c,sec:30,exp:s.e});},

()=>{ const small=R(8,30),diff=R(4,20),sum=small*2+diff;
  return QI({tag:G('和差算','和差问题','Sum and difference'),q:G(`兄と 弟が あめを 合わせて ${sum}こ 持って います。\n兄は 弟より ${diff}こ 多く 持って います。\n兄は 何こ 持って いますか。`,
      `哥哥和弟弟一共有 ${sum} 颗糖，哥哥比弟弟多 ${diff} 颗。哥哥有多少颗？`,
      `Two brothers have ${sum} sweets between them.\nThe older one has ${diff} more than the younger.\nHow many does the older brother have?`),
    unit:G('こ','颗','sweets'),val:small+diff,sec:50,
    exp:G(`(${sum}+${diff})÷2=${small+diff}こ が 兄。弟は ${small}こ。`,`(${sum}+${diff})÷2=${small+diff} 颗是哥哥，弟弟 ${small} 颗。`,
          `(${sum}+${diff})÷2=${small+diff} for the older brother; the younger has ${small}.`)});},

()=>{ const d=P([3,4,5,6]),n=R(8,15),len=d*n;
  return QI({tag:G('植木算','植树问题','Posts round a loop'),q:G(`まわりの 長さが ${len}m の 池の まわりに、${d}mおきに くいを 打ちます。\nくいは 何本 いりますか。`,
      `一个周长 ${len} 米的池塘，沿池边每隔 ${d} 米打一根木桩。需要多少根？`,
      `Posts are driven every ${d}m all the way round a pond whose perimeter is ${len}m.\nHow many posts are needed?`),
    unit:G('本','根','posts'),val:n,sec:45,
    exp:G(`まわりが つながって いるので、間の数と くいの数は 同じ。${len}÷${d}=${n}本。`,
          `封闭一圈时桩数 = 间隔数，${len}÷${d}=${n} 根。`,

    val:n/L2,disp:frMixed(n,L2),note:UI.fracN,sec:45,
    exp:G(`分母を ${L2}に そろえて ${a*(L2/b)}/${L2}+${c*(L2/d)}/${L2}=${frMixed(n,L2)}。`,
          `通分到 ${L2}：${a*(L2/b)}/${L2}+${c*(L2/d)}/${L2}=${frMixed(n,L2)}。`,
          `Put both over ${L2}: ${a*(L2/b)}/${L2}+${c*(L2/d)}/${L2}=${frMixed(n,L2)}.`)});},

()=>{ const p=R(12,40)*100,k=P([1,2,3]);
  return QI({tag:G('割合','百分数','Percentages'),q:G(`定価 ${p}円の シャツを、${k}割引きで 買いました。\n代金は 何円 ですか。`,
      `一件标价 ${p} 日元的衬衫按 ${k*10}% 的折扣（即减价 ${k*10}%）出售。实付多少日元？`,
      `A shirt priced at ${p} yen is sold with ${k*10}% off.\nHow much do you pay?`),
    unit:G('円','日元','yen'),val:p*(10-k)/10,sec:45,
    exp:G(`${k}割引きは 定価の ${10-k}割 = ${(10-k)/10}倍。${p}×${(10-k)/10}=${p*(10-k)/10}円。`,
          `打折后是原价的 ${(10-k)*10}%：${p}×${(10-k)/10}=${p*(10-k)/10} 日元。`,
          `You pay ${(10-k)*10}% of the price: ${p}×${(10-k)/10}=${p*(10-k)/10} yen.`)});},

()=>{ const t=P([0,1,2]);
  if(t===0){ const v=R(50,90),m=R(12,40);
    return QI({tag:G('速さ','速度','Speed'),q:G(`分速 ${v}m で 歩く 人が ${m}分間 歩きました。\n進んだ 道のりは 何m ですか。`,
        `以每分钟 ${v} 米的速度走 ${m} 分钟，走了多少米？`,
        `Someone walks at ${v} metres per minute for ${m} minutes.\nHow far do they walk, in metres?`),
      unit:G('m','m','m'),val:v*m,sec:35,exp:G(`道のり=速さ×時間。${v}×${m}=${v*m}m。`,`路程=速度×时间：${v}×${m}=${v*m} 米。`,
        `Distance = speed × time: ${v}×${m}=${v*m}m.`)});}
  if(t===1){ const km=R(3,9)*6,h=R(2,4),v=km/h;
    return QI({tag:G('速さ','速度','Speed'),q:G(`${km}km の 道のりを ${h}時間で 進みました。\n時速 何km ですか。`,
        `${km} 公里的路程用了 ${h} 小时。时速是多少公里？`,
        `A journey of ${km}km takes ${h} hours.\nWhat is the speed in km per hour?`),
      unit:G('km','km/h','km/h'),val:v,sec:35,exp:G(`速さ=道のり÷時間。${km}÷${h}=${v}km/時。`,`速度=路程÷时间：${km}÷${h}=${v} km/h。`,
        `Speed = distance ÷ time: ${km}÷${h}=${v}km/h.`)});}
  const kmh=R(3,12)*6;
  return QI({tag:G('速さ','速度','Speed'),q:G(`時速 ${kmh}km は、分速 何m ですか。`,`时速 ${kmh} 公里等于每分钟多少米？`,`${kmh}km per hour is how many metres per minute?`),
    unit:G('m','m','m'),val:kmh*1000/60,sec:45,
    exp:G(`${kmh}km=${kmh*1000}m、1時間=60分。${kmh*1000}÷60=${kmh*1000/60}m。`,`${kmh*1000}m÷60分=${kmh*1000/60} 米/分。`,
          `${kmh}km=${kmh*1000}m and 1 hour = 60 minutes, so ${kmh*1000}÷60=${kmh*1000/60}m.`)});},

()=>{ const a=R(20,90),d=R(80,400),p=a*d;
  return QI({tag:G('単位量あたり','单位量','Rates'),q:G(`面積が ${a}km²、人口が ${p}人の 町が あります。\nこの 町の 人口密度（1km²あたりの 人数）は 何人 ですか。`,
      `一个城镇面积 ${a} 平方公里，人口 ${p} 人。人口密度（每平方公里人数）是多少？`,
      `A town covers ${a}km² and has ${p} people.\nWhat is its population density, in people per km²?`),
    unit:G('人','人','people'),val:d,sec:40,exp:G(`${p}÷${a}=${d}人。`,`${p}÷${a}=${d} 人/km²。`,`${p}÷${a}=${d} people per km².`)});},

()=>{ const t=P([0,1,2]);
  if(t===0){ const a=R(4,12),b=R(5,15),h=R(4,12);
    return QI({tag:G('面積','面积','Area'),q:G(`上底 ${a}cm、下底 ${b}cm、高さ ${h}cm の 台形の 面積は 何cm² ですか。`,
        `上底 ${a}cm、下底 ${b}cm、高 ${h}cm 的梯形，面积是多少 cm²？`,
        `A trapezium has parallel sides of ${a}cm and ${b}cm and a height of ${h}cm.\nWhat is its area in cm²?`),
      unit:G('cm²','cm²','cm²'),val:(a+b)*h/2,sec:40,
      exp:G(`(上底+下底)×高さ÷2=(${a}+${b})×${h}÷2=${(a+b)*h/2}cm²。`,`(${a}+${b})×${h}÷2=${(a+b)*h/2}cm²。`,
            `(sum of parallel sides) × height ÷ 2 = (${a}+${b})×${h}÷2=${(a+b)*h/2}cm².`)});}
  if(t===1){ const d1=R(6,16),d2=R(5,15);
    return QI({tag:G('面積','面积','Area'),q:G(`対角線が ${d1}cm と ${d2}cm の ひし形の 面積は 何cm² ですか。`,
        `两条对角线分别为 ${d1}cm 和 ${d2}cm 的菱形，面积是多少 cm²？`,
        `A rhombus has diagonals of ${d1}cm and ${d2}cm.\nWhat is its area in cm²?`),
      unit:G('cm²','cm²','cm²'),val:d1*d2/2,sec:35,
      exp:G(`対角線×対角線÷2=${d1}×${d2}÷2=${d1*d2/2}cm²。`,`对角线乘积的一半：${d1}×${d2}÷2=${d1*d2/2}cm²。`,
            `Half the product of the diagonals: ${d1}×${d2}÷2=${d1*d2/2}cm².`)});}
  const b=R(6,18),h=R(5,14);
  return QI({tag:G('面積','面积','Area'),q:G(`底辺 ${b}cm、高さ ${h}cm の 三角形の 面積は 何cm² ですか。`,
      `底 ${b}cm、高 ${h}cm 的三角形，面积是多少 cm²？`,
      `A triangle has a base of ${b}cm and a height of ${h}cm.\nWhat is its area in cm²?`),
    unit:G('cm²','cm²','cm²'),val:b*h/2,sec:30,exp:G(`底辺×高さ÷2=${b*h/2}cm²。`,`底×高÷2=${b*h/2}cm²。`,`base × height ÷ 2 = ${b*h/2}cm².`)});},

()=>{ const a=R(10,30),b=R(10,25),h=R(5,20),dep=R(3,h-1);
  return QI({tag:G('体積','体积','Volume'),q:G(`内のりが たて ${a}cm、よこ ${b}cm、深さ ${h}cm の 水そうに、深さ ${dep}cm まで 水を 入れました。\n水の 体積は 何cm³ ですか。`,
      `一个内部长 ${b}cm、宽 ${a}cm、深 ${h}cm 的水槽，注水到 ${dep}cm 深。水的体积是多少 cm³？`,
      `A tank measures ${a}cm by ${b}cm inside and is ${h}cm deep. It is filled with water to a depth of ${dep}cm.\nWhat is the volume of the water, in cm³?`),
    unit:G('cm³','cm³','cm³'),val:a*b*dep,sec:40,
    exp:G(`${a}×${b}×${dep}=${a*b*dep}cm³。深さ ${h}cm は 使いません。`,`${a}×${b}×${dep}=${a*b*dep}cm³（深度 ${h}cm 是干扰条件）。`,
          `${a}×${b}×${dep}=${a*b*dep}cm³. The ${h}cm depth of the tank is not needed.`)});},

()=>{ let m,f,x,y,avg,k=0;
  do{ m=R(12,22);f=R(12,22);x=R(60,90);y=R(60,95);avg=(m*x+f*y)/(m+f);k++; }
  while(Math.abs(avg*2-Math.round(avg*2))>1e-9 && k<400);
  return QI({tag:G('平均','平均数','Averages'),q:G(`あるクラスの 男子 ${m}人の 平均点は ${x}点、女子 ${f}人の 平均点は ${y}点 でした。\nクラス全体の 平均点は 何点 ですか。`,
      `某班男生 ${m} 人平均 ${x} 分，女生 ${f} 人平均 ${y} 分。全班平均分是多少？`,
      `In a class, ${m} boys averaged ${x} marks and ${f} girls averaged ${y} marks.\nWhat is the average for the whole class?`),
    unit:G('点','分','marks'),val:avg,sec:60,
    exp:G(`合計は ${m}×${x}+${f}×${y}=${m*x+f*y}点。人数は ${m+f}人。${m*x+f*y}÷${m+f}=${num(avg)}点。`,
          `总分 ${m*x+f*y}，人数 ${m+f}，平均 ${num(avg)} 分。`,
          `Total marks ${m}×${x}+${f}×${y}=${m*x+f*y} over ${m+f} pupils: ${m*x+f*y}÷${m+f}=${num(avg)}.`)});},

()=>{ let n,a,b,r1,r2,k=0;
  do{ n=R(6,18);a=R(3,6);b=a+R(1,3);r1=R(2,12);r2=(b-a)*n-r1;k++; }while((r2<=0||r2>15)&&k<200);
  return QI({tag:G('過不足算','盈亏问题','Surplus and shortage'),q:G(`あめを 子どもに 配ります。\n1人に ${a}こずつ 配ると ${r1}こ あまり、1人に ${b}こずつ 配ると ${r2}こ たりません。\n子どもは 何人 いますか。`,
      `把糖分给小朋友。每人 ${a} 颗则剩 ${r1} 颗，每人 ${b} 颗则差 ${r2} 颗。有多少个小朋友？`,
      `Sweets are shared among some children.\nGiving ${a} each leaves ${r1} over; giving ${b} each leaves you ${r2} short.\nHow many children are there?`),
    unit:G('人','人','children'),val:n,sec:70,
    exp:G(`1人あたり ${b-a}こ ふえると 必要数が ${r1+r2}こ ふえる。${r1+r2}÷${b-a}=${n}人。あめは ${a*n+r1}こ。`,
          `每人多分 ${b-a} 颗，总需求多 ${r1}+${r2}=${r1+r2} 颗，人数 ${r1+r2}÷${b-a}=${n} 人（糖 ${a*n+r1} 颗）。`,
          `Giving ${b-a} more each needs ${r1}+${r2}=${r1+r2} extra sweets, so ${r1+r2}÷${b-a}=${n} children (and ${a*n+r1} sweets).`)});},

()=>{ const s=P([
   {q:G('つぎの 数の うち、3でも 4でも わりきれる 数は どれですか。','下面哪个数既能被 3 整除又能被 4 整除？','Which of these divides exactly by both 3 and 4?'),
    o:[G('96','96','96'),G('92','92','92'),G('68','68','68'),G('54','54','54')],c:0,
    e:G('3でも 4でも わりきれる 数は 12の倍数。96=12×8。92と68は 4で わりきれても 3で わりきれず、54は 3だけ。',
        '同时被 3、4 整除即 12 的倍数：96=12×8。92、68 只能被 4 整除，54 只能被 3 整除。',
        'A number divisible by both 3 and 4 is a multiple of 12: 96=12×8. 92 and 68 take 4 but not 3; 54 takes 3 but not 4.')},
   {q:G('12と 18の 最大公約数は どれですか。','12 和 18 的最大公因数是多少？','What is the highest common factor of 12 and 18?'),
    o:[G('6','6','6'),G('3','3','3'),G('12','12','12'),G('36','36','36')],c:0,
    e:G('12=2×2×3、18=2×3×3。共通なのは 2×3=6。','12=2×2×3，18=2×3×3，公共部分 2×3=6。','12=2×2×3 and 18=2×3×3; the shared factors give 2×3=6.')},
   {q:G('偶数と 奇数に ついて、いつでも 正しい ものは どれですか。','关于奇数和偶数，下面哪句总是成立？','Which is always true about odd and even numbers?'),
    o:[G('奇数+奇数は 偶数','奇数+奇数=偶数','odd + odd = even'),G('奇数+奇数は 奇数','奇数+奇数=奇数','odd + odd = odd'),
       G('偶数×奇数は 奇数','偶数×奇数=奇数','even × odd = odd'),G('偶数+奇数は 偶数','偶数+奇数=偶数','even + odd = even')],c:0,
    e:G('奇数=2×□+1。2つ たすと 2×(□+□)+2 で 偶数に なります。','两个奇数相加，余数 1+1=2，结果为偶数。','An odd number is 2×□+1; adding two gives 2×(□+□)+2, which is even.')}]);
  return QC({tag:G('数の性質','数的性质','Number properties'),q:s.q,opts:s.o,ci:s.c,sec:40,exp:s.e});},

()=>{ const d=R(4,20)*2;
  return QI({tag:G('円','圆','Circles'),q:G(`直径 ${d}cm の 円の まわりの 長さは 何cm ですか。円周率は 3.14 と します。`,
      `直径 ${d}cm 的圆，周长是多少 cm？（π 取 3.14）`,
      `What is the circumference of a circle with diameter ${d}cm? Take π as 3.14.`),
    unit:G('cm','cm','cm'),val:Math.round(d*3.14*100)/100,sec:35,
    exp:G(`直径×3.14=${d}×3.14=${num(Math.round(d*3.14*100)/100)}cm。`,`直径×3.14=${num(Math.round(d*3.14*100)/100)}cm。`,
          `diameter × 3.14 = ${d}×3.14=${num(Math.round(d*3.14*100)/100)}cm.`)});},

()=>{ let den,nu; do{ den=P([3,4,5,7,8,9]); nu=R(1,den-1); }while(gcd(nu,den)!==1);
  const rest=R(6,25)*(den-nu), total=rest*den/(den-nu);
  return QI({tag:G('割合','分数应用','Fraction of a whole'),q:G(`本を 全体の ${nu}/${den} まで 読んだら、のこりは ${rest}ページ でした。\nこの 本は 全部で 何ページ ですか。`,
      `一本书读了全书的 ${nu}/${den}，还剩 ${rest} 页。全书共多少页？`,
      `After reading ${nu}/${den} of a book, ${rest} pages are left.\nHow many pages does the book have altogether?`),
    unit:G('ページ','页','pages'),val:total,sec:60,
    exp:G(`のこりは 全体の ${fr(den-nu,den)}。${rest}÷${fr(den-nu,den)}=${total}ページ。`,
          `剩下的占 ${fr(den-nu,den)}，${rest}÷${fr(den-nu,den)}=${total} 页。`,
          `The remainder is ${fr(den-nu,den)} of the book, so ${rest}÷${fr(den-nu,den)}=${total} pages.`)});},

()=>{ const n=P([5,6,8,9,10,12]);
  return QI({tag:G('正多角形','正多边形','Regular polygons'),q:G(`正${n}角形の 1つの 内角は 何度 ですか。`,`正 ${n} 边形的一个内角是多少度？`,`What is one interior angle of a regular ${n}-sided polygon?`),
    unit:G('度','度','degrees'),val:180*(n-2)/n,sec:50,
    exp:G(`内角の 和は 180×(${n}−2)=${180*(n-2)}度。1つ分は ${180*(n-2)}÷${n}=${180*(n-2)/n}度。`,
          `内角和 180×(${n}−2)=${180*(n-2)} 度，每个 ${180*(n-2)/n} 度。`,
          `The interior angles total 180×(${n}−2)=${180*(n-2)}°, so each one is ${180*(n-2)}÷${n}=${180*(n-2)/n}°.`)});},

()=>{ const b=R(4,20)*5,p=P([10,20,25,40,50,60,75]),a=b*p/100;
  return QI({tag:G('割合','百分数','Percentages'),q:G(`${a}人は ${b}人の 何% ですか。`,`${a} 人是 ${b} 人的百分之几？`,`${a} people is what percentage of ${b} people?`),
    unit:G('%','%','%'),val:p,sec:40,
    exp:G(`くらべる量÷もとにする量=${a}÷${b}=${num(a/b)}。100をかけて ${p}%。`,`${a}÷${b}=${num(a/b)}，即 ${p}%。`,
          `${a}÷${b}=${num(a/b)}, and ×100 gives ${p}%.`)});}
);

/* ======================= 小学6年 ======================= */
BANK[6].push(
()=>{ let a,b,c,d; do{ b=R(3,9);a=R(1,b-1);d=R(3,9);c=R(1,d-1); }
  while(gcd(a,b)!==1||gcd(c,d)!==1||(a===c&&b===d));
  const n=a*d,m=b*c;
  return QI({tag:G('分数の計算','分数计算','Fraction calculation'),q:G(`つぎの 計算を しましょう。答えは 分数で 書きましょう。\n\n[[${a}/${b} ÷ ${c}/${d}]]`,
      `计算（分数作答）：\n\n[[${a}/${b} ÷ ${c}/${d}]]`,
      `Work this out. Give your answer as a fraction.\n\n[[${a}/${b} ÷ ${c}/${d}]]`),
    val:n/m,disp:frMixed(n,m),note:UI.fracN,sec:45,
    exp:G(`わる数を 逆数に して かけます。${a}/${b}×${d}/${c}=${frMixed(n,m)}。`,
          `除以一个分数等于乘它的倒数：${a}/${b}×${d}/${c}=${frMixed(n,m)}。`,
          `Dividing by a fraction means multiplying by its reciprocal: ${a}/${b}×${d}/${c}=${frMixed(n,m)}.`)});},

()=>{ const r=R(3,12),k=P([[G('4分の1','四分之一','a quarter'),4],[G('2分の1','二分之一','a half'),2]]);
  const v=Math.round(r*r*3.14/k[1]*100)/100;
  return QI({tag:G('円の面積','圆的面积','Area of a circle'),q:G(`半径 ${r}cm の 円の ${k[0].ja}の おうぎ形の 面積は 何cm² ですか。円周率は 3.14 と します。`,
      `半径 ${r}cm 的圆的${k[0].zh}扇形，面积是多少 cm²？（π 取 3.14）`,
      `What is the area of ${k[0].en} of a circle of radius ${r}cm, in cm²? Take π as 3.14.`),
    unit:G('cm²','cm²','cm²'),val:v,sec:50,
    exp:G(`円の 面積は ${r}×${r}×3.14=${num(r*r*3.14)}cm²。その ${k[0].ja}で ${num(v)}cm²。`,
          `整圆面积 ${num(r*r*3.14)}cm²，取${k[0].zh}得 ${num(v)}cm²。`,
          `The whole circle is ${r}×${r}×3.14=${num(r*r*3.14)}cm²; ${k[0].en} of that is ${num(v)}cm².`)});},

()=>{ const t=P([0,1]);
  if(t===0){ const r=R(3,8),h=R(5,15);
    const v=Math.round(r*r*3.14*h*100)/100;
    return QI({tag:G('体積','体积','Volume'),q:G(`底面の 半径が ${r}cm、高さが ${h}cm の 円柱の 体積は 何cm³ ですか。円周率は 3.14 と します。`,
        `底面半径 ${r}cm、高 ${h}cm 的圆柱，体积是多少 cm³？（π 取 3.14）`,
        `A cylinder has base radius ${r}cm and height ${h}cm.\nWhat is its volume in cm³? Take π as 3.14.`),
      unit:G('cm³','cm³','cm³'),val:v,sec:50,
      exp:G(`底面積 ${r}×${r}×3.14=${num(r*r*3.14)}cm²。×高さ ${h}=${num(v)}cm³。`,`底面积 ${num(r*r*3.14)}cm² × 高 ${h} = ${num(v)}cm³。`,
            `Base area ${r}×${r}×3.14=${num(r*r*3.14)}cm², times height ${h} gives ${num(v)}cm³.`)});}
  const b=R(4,12),hh=R(4,10),h=R(6,15);
  return QI({tag:G('体積','体积','Volume'),q:G(`底面が 底辺 ${b}cm、高さ ${hh}cm の 三角形で、高さが ${h}cm の 三角柱の 体積は 何cm³ ですか。`,
      `底面是底 ${b}cm、高 ${hh}cm 的三角形，柱高 ${h}cm 的三棱柱，体积是多少 cm³？`,
      `A triangular prism has a base triangle with base ${b}cm and height ${hh}cm, and the prism is ${h}cm long.\nWhat is its volume in cm³?`),
    unit:G('cm³','cm³','cm³'),val:b*hh/2*h,sec:45,
    exp:G(`底面積 ${b}×${hh}÷2=${b*hh/2}cm²。×${h}=${b*hh/2*h}cm³。`,`底面积 ${b*hh/2}cm² × ${h} = ${b*hh/2*h}cm³。`,
          `Base area ${b}×${hh}÷2=${b*hh/2}cm², times ${h} gives ${b*hh/2*h}cm³.`)});},

()=>{ const a=R(2,7),b=R(2,7),k=R(4,14),tot=(a+b)*k;
  return QI({tag:G('比','比','Ratio'),q:G(`${tot}まいの カードを、兄と 弟で ${a}:${b} に なるように 分けます。\n兄は 何まい もらえますか。`,
      `把 ${tot} 张卡片按 ${a}:${b} 分给哥哥和弟弟。哥哥分到多少张？`,
      `${tot} cards are shared between two brothers in the ratio ${a}:${b}.\nHow many does the older brother get?`),
    unit:G('まい','张','cards'),val:a*k,sec:50,
    exp:G(`比の 合計は ${a}+${b}=${a+b}。${tot}÷${a+b}=${k} が 1あたり。兄は ${k}×${a}=${a*k}まい。`,
          `份数共 ${a+b}，每份 ${tot}÷${a+b}=${k}，哥哥 ${a} 份 = ${a*k} 张。`,
          `There are ${a}+${b}=${a+b} shares; each is ${tot}÷${a+b}=${k}. The older brother gets ${a} of them: ${a*k}.`)});},

()=>{ let a,b,n; do{ a=R(12,40);b=R(8,36);n=R(3,12); }while(a===b||(a*n)%b!==0);
  return QI({tag:G('反比例','反比例','Inverse proportion'),q:G(`歯の 数が ${a}の 歯車Aと、歯の 数が ${b}の 歯車Bが かみ合って います。\n歯車Aが ${n}回転する とき、歯車Bは 何回転 しますか。`,
      `齿数 ${a} 的齿轮 A 与齿数 ${b} 的齿轮 B 啮合。A 转 ${n} 圈时，B 转多少圈？`,
      `Gear A has ${a} teeth and meshes with gear B, which has ${b} teeth.\nWhen gear A turns ${n} times, how many times does gear B turn?`),
    unit:G('回転','圈','turns'),val:a*n/b,sec:55,
    exp:G(`かみ合う 歯の 数は 同じ。${a}×${n}=${a*n}、${a*n}÷${b}=${a*n/b}回転。`,`啮合齿数相同：${a}×${n}÷${b}=${a*n/b} 圈。`,
          `The same number of teeth pass the meshing point: ${a}×${n}=${a*n}, then ${a*n}÷${b}=${a*n/b} turns.`)});},

()=>{ const t=P([0,1]);
  if(t===0){ const n=R(4,7);
    return QI({tag:G('場合の数','计数','Counting'),q:G(`${n}人の 中から、そうじ当番を 2人 えらびます。\nえらび方は 何通り ありますか。`,
        `从 ${n} 个人中选 2 人做值日。有多少种选法？`,
        `Two people are chosen from ${n} to be on cleaning duty.\nHow many different choices are there?`),
      unit:G('通り','种','ways'),val:n*(n-1)/2,sec:55,
      exp:G(`${n}×${n-1}=${n*(n-1)}通り は 順番を 区別した 数。2人の 順番は 関係ないので ÷2 して ${n*(n-1)/2}通り。`,
            `有序时 ${n}×${n-1}=${n*(n-1)} 种，选人不分先后，÷2 得 ${n*(n-1)/2} 种。`,
            `${n}×${n-1}=${n*(n-1)} counts order; the two are interchangeable, so divide by 2 to get ${n*(n-1)/2}.`)});}
  const n=R(4,6);
  return QI({tag:G('場合の数','计数','Counting'),q:G(`${n}まいの ちがう カードから 3まいを えらんで 横に ならべます。\nならべ方は 何通り ありますか。`,
      `从 ${n} 张不同的卡片中取 3 张排成一行。有多少种排法？`,
      `Three cards are chosen from ${n} different cards and laid out in a row.\nHow many arrangements are possible?`),
    unit:G('通り','种','ways'),val:n*(n-1)*(n-2),sec:55,
    exp:G(`1まい目 ${n}通り、2まい目 ${n-1}通り、3まい目 ${n-2}通り。${n}×${n-1}×${n-2}=${n*(n-1)*(n-2)}通り。`,
          `${n}×${n-1}×${n-2}=${n*(n-1)*(n-2)} 种。`,
          `${n} choices, then ${n-1}, then ${n-2}: ${n}×${n-1}×${n-2}=${n*(n-1)*(n-2)}.`)});},

()=>{ const va=R(50,90),vb=R(50,90),t=R(6,15),d=(va+vb)*t;
  return QI({tag:G('旅人算','行程问题','Travel problem'),q:G(`${d}m はなれた 2地点から、A さんは 分速 ${va}m、B さんは 分速 ${vb}m で 同時に 向かい合って 歩き出しました。\n2人が 出会うのは 何分後 ですか。`,
      `相距 ${d} 米的两地，A 以每分 ${va} 米、B 以每分 ${vb} 米同时相向出发。几分钟后相遇？`,
      `Two people start at the same moment from points ${d}m apart and walk towards each other, A at ${va} m/min and B at ${vb} m/min.\nAfter how many minutes do they meet?`),
    unit:G('分後','分钟后','minutes'),val:t,sec:60,
    exp:G(`1分間に 2人 合わせて ${va}+${vb}=${va+vb}m 近づきます。${d}÷${va+vb}=${t}分後。`,
          `每分钟共接近 ${va+vb} 米，${d}÷${va+vb}=${t} 分钟。`,
          `Together they close ${va}+${vb}=${va+vb}m every minute: ${d}÷${va+vb}=${t} minutes.`)});},

()=>{ const p=P([[12,6,4],[10,15,6],[20,30,12],[6,12,4],[8,24,6],[9,18,6],[15,10,6],[18,9,6]]);
  return QI({tag:G('仕事算','工程问题','Work rate'),q:G(`ある仕事を、A さん 1人では ${p[0]}日、B さん 1人では ${p[1]}日で 終わらせる ことが できます。\n2人で いっしょに すると 何日で 終わりますか。`,
      `一项工作，A 单独做需 ${p[0]} 天，B 单独做需 ${p[1]} 天。两人合作需要几天？`,
      `A job takes A alone ${p[0]} days and B alone ${p[1]} days.\nWorking together, how many days does it take?`),
    unit:G('日','天','days'),val:p[2],sec:65,
    exp:G(`全体を 1と すると 1日に A は 1/${p[0]}、B は 1/${p[1]}。合わせて ${fr(p[0]+p[1],p[0]*p[1])}。1÷それ=${p[2]}日。`,
          `设总量为 1，每天共完成 1/${p[0]}+1/${p[1]}=${fr(p[0]+p[1],p[0]*p[1])}，1÷它 = ${p[2]} 天。`,
          `Call the job 1. Each day they do 1/${p[0]}+1/${p[1]}=${fr(p[0]+p[1],p[0]*p[1])}, so it takes ${p[2]} days.`)});},

()=>{ const t=P([0,1]);
  if(t===0){ const g=R(2,8)*50,p=P([4,5,6,8,10,12]);
    return QI({tag:G('食塩水','浓度','Concentration'),q:G(`${p}% の 食塩水が ${g}g あります。\nこの中に とけて いる 食塩は 何g ですか。`,
        `有 ${p}% 的盐水 ${g} 克。其中溶解的盐有多少克？`,
        `You have ${g}g of ${AN(p)} ${p}% salt solution.\nHow many grams of salt does it contain?`),
      unit:G('g','g','g'),val:g*p/100,sec:45,
      exp:G(`${g}×0.${String(p).padStart(2,'0')}=${g*p/100}g。`,`${g}×${p}%=${g*p/100} 克。`,`${g}×${p}% = ${g*p/100}g.`)});}
  const salt=R(2,9)*5,water=R(4,12)*20;
  return QI({tag:G('食塩水','浓度','Concentration'),q:G(`水 ${water}g に 食塩 ${salt}g を とかしました。\nこの 食塩水の こさは 何% ですか。`,
      `在 ${water} 克水中溶解 ${salt} 克盐。这杯盐水的浓度是百分之几？`,
      `${salt}g of salt is dissolved in ${water}g of water.\nWhat is the concentration of the solution, as a percentage?`),
    unit:G('%','%','%'),val:Math.round(salt/(salt+water)*10000)/100,sec:55,
    exp:G(`食塩水は ${salt+water}g。${salt}÷${salt+water}×100=${num(Math.round(salt/(salt+water)*10000)/100)}%。`,
          `盐水共 ${salt+water} 克，${salt}÷${salt+water}=${num(Math.round(salt/(salt+water)*10000)/100)}%。`,
          `The solution weighs ${salt+water}g, so ${salt}÷${salt+water}×100=${num(Math.round(salt/(salt+water)*10000)/100)}%.`)});},

()=>{ const k=P([1000,2000,5000,25000,50000]),cm=R(2,12);
  const m=cm*k/100;
  return QI({tag:G('縮図','比例尺','Scale drawing'),q:G(`縮尺 1/${k} の 地図で、${cm}cm の 長さは、実際には 何m ですか。`,
      `在比例尺为 1:${k} 的地图上，${cm}cm 对应实际多少米？`,
      `On a map with a scale of 1:${k}, a length of ${cm}cm represents how many metres on the ground?`),
    unit:G('m','m','m'),val:m,sec:55,
    exp:G(`実際は ${cm}×${k}=${cm*k}cm。100で わって ${m}m。`,`实际 ${cm}×${k}=${cm*k}cm = ${m} 米。`,
          `${cm}×${k}=${cm*k}cm in real life; divide by 100 to get ${m}m.`)});},

()=>{ const s=P([
   {q:G('線対称でも 点対称でも ある 図形は どれですか。','下面哪个图形既是轴对称图形又是中心对称图形？','Which shape has both line symmetry and point symmetry?'),
    o:[G('長方形','长方形','Rectangle'),G('正三角形','等边三角形','Equilateral triangle'),G('二等辺三角形','等腰三角形','Isosceles triangle'),G('台形','梯形','Trapezium')],c:0,
    e:G('正三角形は 線対称ですが 点対称では ありません。長方形は どちらにも なります。','等边三角形只是轴对称；长方形两者都满足。','An equilateral triangle has line symmetry but not point symmetry; a rectangle has both.')},
   {q:G('点対称な 図形に ついて、正しい ものは どれですか。','关于中心对称图形，下面哪句是对的？','Which is true of a shape with point symmetry?'),
    o:[G('180度 回すと もとの 形に ぴったり 重なる','旋转 180 度后与原图重合','Turning it 180° maps it onto itself'),
       G('90度 回すと かならず 重なる','旋转 90 度一定重合','Turning it 90° always maps it onto itself'),
       G('折ると ぴったり 重なる','对折后一定重合','Folding it always makes the halves match'),
       G('かならず 辺が 4本 ある','一定有 4 条边','It must have four sides')],c:0,
    e:G('折って 重なるのは 線対称です。','对折重合的是轴对称。','Folding to match is line symmetry, not point symmetry.')}]);
  return QC({tag:G('対称','对称','Symmetry'),q:s.q,opts:s.o,ci:s.c,sec:40,exp:s.e});},

()=>{ const d=SH([R(2,9),R(2,9),R(10,19),R(10,19),R(3,9),R(11,18),R(4,14)]);
  const so=d.slice().sort((x,y)=>x-y),med=so[3];
  const t=P([0,1]);
  const fig=G(d.join('、'),d.join('、'),d.join(', '));
  return t===0
    ? QI({tag:G('資料の調べ方','数据','Data'),q:G('つぎの 7つの 記録が あります。\n中央値（メジアン）は いくつですか。','下面是 7 个数据。中位数是多少？',
        'Here are seven results.\nWhat is the median?'),
        fig:fig,val:med,sec:45,
        exp:G(`小さい 順に ならべると ${so.join('、')}。まん中の 4番目は ${med}。`,`排序后为 ${so.join('、')}，中间第 4 个是 ${med}。`,
              `In order they are ${so.join(', ')}; the 4th, in the middle, is ${med}.`)})
    : QI({tag:G('資料の調べ方','数据','Data'),q:G('つぎの 7つの 記録が あります。\n平均値は いくつですか。（わりきれない ときは 小数で 答えなさい）',
        '下面是 7 个数据。平均数是多少？（除不尽时用小数作答）',
        'Here are seven results.\nWhat is the mean? Give a decimal if it does not divide exactly.'),
        fig:fig,val:Math.round(d.reduce((s,x)=>s+x,0)/7*1000)/1000,
        note:G('小数第3位まで で 答えなさい','请保留到小数点后 3 位','Give your answer to 3 decimal places'),sec:50,
        exp:G(`合計 ${d.reduce((s,x)=>s+x,0)} を 7で わって ${num(Math.round(d.reduce((s,x)=>s+x,0)/7*1000)/1000)}。`,
              `总和 ${d.reduce((s,x)=>s+x,0)} ÷ 7 = ${num(Math.round(d.reduce((s,x)=>s+x,0)/7*1000)/1000)}。`,
              `The total is ${d.reduce((s,x)=>s+x,0)}; divided by 7 that is ${num(Math.round(d.reduce((s,x)=>s+x,0)/7*1000)/1000)}.`)});},

()=>{ const cost=R(4,20)*100,rate=P([20,25,30,40,50]),price=cost*(100+rate)/100;
  return QI({tag:G('売買損益','利润问题','Profit and loss'),q:G(`原価 ${cost}円の 品物に、原価の ${rate}% の 利益を 見こんで 定価を つけました。\n定価は 何円 ですか。`,
      `一件成本 ${cost} 日元的商品，按成本的 ${rate}% 加价定价。定价是多少日元？`,
      `An item costing ${cost} yen is marked up by ${rate}% of the cost.\nWhat is the selling price, in yen?`),
    unit:G('円','日元','yen'),val:price,sec:50,
    exp:G(`${cost}×${(100+rate)/100}=${price}円。`,`${cost}×(1+${rate}%)=${price} 日元。`,`${cost}×${(100+rate)/100}=${price} yen.`)});},

()=>{ const v=P([10,12,15,20,25]); let len,bl;
  do{ len=R(8,20)*10; bl=v*R(15,50)-len; }while(bl<150||bl>700||bl%10!==0);
  return QI({tag:G('通過算','火车过桥','Train crossing'),q:G(`長さ ${len}m の 電車が、秒速 ${v}m で 長さ ${bl}m の 鉄橋を わたります。\nわたり始めてから わたり終わるまで 何秒 かかりますか。`,
      `一列长 ${len} 米的火车以每秒 ${v} 米通过一座长 ${bl} 米的桥。从车头上桥到车尾离桥需要多少秒？`,
      `A train ${len}m long crosses a bridge ${bl}m long at ${v} metres per second.\nHow many seconds pass between the front entering and the back leaving?`),
    unit:G('秒','秒','seconds'),val:(len+bl)/v,sec:65,
    exp:G(`進む 道のりは 鉄橋+電車の 長さ=${bl}+${len}=${bl+len}m。${bl+len}÷${v}=${num((len+bl)/v)}秒。`,
          `总路程 = 桥长 + 车长 = ${bl+len} 米，${bl+len}÷${v}=${num((len+bl)/v)} 秒。`,
          `The train travels bridge + train = ${bl}+${len}=${bl+len}m, so ${bl+len}÷${v}=${num((len+bl)/v)} seconds.`)});}
);

/* ================= 応用問題（4年） ================= */
COMP[4].push(
CQ(()=>{ let B,x,y,avg; do{ B=R(58,84); x=R(4,13); y=R(3,11); avg=(3*B+x-y)/3; }while(!Number.isInteger(avg));
  return QI({tag:G('応用・平均と和差','综合 · 平均与和差','Applied · averages'),
    q:G(`A、B、C の 3人が テストを 受けました。\nA は B より ${x}点 高く、C は B より ${y}点 低い 点数でした。\n3人の 平均点が ${avg}点の とき、A の 点数は 何点 ですか。`,
        `A、B、C 三人考试。A 比 B 高 ${x} 分，C 比 B 低 ${y} 分。三人平均分是 ${avg} 分。A 考了多少分？`,
        `A, B and C sat a test.\nA scored ${x} marks more than B, and C scored ${y} marks less than B.\nThe three of them averaged ${avg} marks. What did A score?`),
    unit:G('点','分','marks'),val:B+x,sec:100,
    exp:G(`合計は ${avg}×3=${avg*3}点。B を もとに すると A=B+${x}、C=B−${y} なので 合計=B×3+${x}−${y}。\nB×3=${avg*3}−${x}+${y}=${3*B} より B=${B}点、A=${B}+${x}=${B+x}点。`,
          `总分 ${avg}×3=${avg*3}。以 B 为基准：总分 = B×3+${x}−${y}，得 B×3=${3*B}，B=${B} 分，A=${B+x} 分。`,
          `The three total ${avg}×3=${avg*3}. Measuring from B: A=B+${x} and C=B−${y}, so the total is B×3+${x}−${y}.\nThen B×3=${avg*3}−${x}+${y}=${3*B}, giving B=${B} and A=${B}+${x}=${B+x}.`)});}),

CQ(()=>{ const a=R(14,26),b=R(16,32),w=R(2,4);
  return QI({tag:G('応用・面積','综合 · 面积','Applied · area'),
    q:G(`たて ${a}m、よこ ${b}m の 長方形の 土地に、はば ${w}m の 道を たてに 1本、よこに 1本 まっすぐ 通しました。\n道を のぞいた 部分の 面積は 何m² ですか。`,
        `一块长 ${b} 米、宽 ${a} 米的长方形土地，纵横各修一条宽 ${w} 米的直路。除去道路后的面积是多少平方米？`,
        `A rectangular field is ${a}m by ${b}m. One straight path ${w}m wide runs across it and another runs down it.\nWhat is the area of the field that is left, in m²?`),
    unit:G('m²','m²','m²'),val:(a-w)*(b-w),sec:110,
    exp:G(`道を はしに よせて 考えると、のこりは たて ${a}−${w}=${a-w}m、よこ ${b}−${w}=${b-w}m の 長方形 1つに まとまります。\n${a-w}×${b-w}=${(a-w)*(b-w)}m²。`,
          `把两条路平移到边上，剩下部分合并成一个 ${a-w}m×${b-w}m 的长方形：${(a-w)*(b-w)} 平方米。`,
          `Slide both paths to the edges and the remaining ground gathers into one rectangle, ${a}−${w}=${a-w}m by ${b}−${w}=${b-w}m.\n${a-w}×${b-w}=${(a-w)*(b-w)}m².`)});}),

CQ(()=>{ const pat=P([['赤','青','青','黄'],['赤','赤','青','黄','黄'],['青','黄','赤','青']]);
  const pz={'赤':'红','青':'蓝','黄':'黄'}, pe={'赤':'red','青':'blue','黄':'yellow'};
  const tgt=P([...new Set(pat)]),p=pat.length,n=R(50,140);
  const per=pat.filter(c=>c===tgt).length;
  const rem=n%p, extra=pat.slice(0,rem).filter(c=>c===tgt).length;
  return QI({tag:G('応用・きまり','综合 · 周期','Applied · patterns'),
    q:G(`${pat.join('・')} の ${p}個を くりかえして、左から ボールを ならべます。\n左から ${n}番目 までに、${tgt}い ボールは 何個 ありますか。`,
        `按 ${pat.map(c=>pz[c]).join('、')} 这 ${p} 个一组循环排列小球。从左数前 ${n} 个当中，${pz[tgt]}色的球有多少个？`,
        `Balls are laid out from the left repeating this group of ${p}: ${pat.map(c=>pe[c]).join(', ')}.\nAmong the first ${n} balls, how many are ${pe[tgt]}?`),
    unit:G('個','个','balls'),val:Math.floor(n/p)*per+extra,sec:110,
    exp:G(`${n}÷${p}=${Math.floor(n/p)}あまり${rem}。1くりかえしに ${tgt}は ${per}個 あるので ${per}×${Math.floor(n/p)}=${per*Math.floor(n/p)}個。\nあまりの ${rem}個の 中に ${extra}個 あるので 合計 ${Math.floor(n/p)*per+extra}個。`,
          `${n}÷${p}=${Math.floor(n/p)}余${rem}。每组有 ${per} 个，共 ${per*Math.floor(n/p)} 个；余下 ${rem} 个里还有 ${extra} 个，合计 ${Math.floor(n/p)*per+extra} 个。`,
          `${n}÷${p}=${Math.floor(n/p)} remainder ${rem}. Each group holds ${per} ${pe[tgt]} balls, giving ${per}×${Math.floor(n/p)}=${per*Math.floor(n/p)}.\nThe leftover ${rem} balls add ${extra} more, so ${Math.floor(n/p)*per+extra} in all.`)});}),

CQ(()=>{ const x=R(3,9);
  return QI({tag:G('応用・やりとり','综合 · 交换','Applied · exchange'),
    q:G(`兄は 弟の 3倍の カードを 持って います。\n兄が 弟に ${x}まい あげると、兄の まい数は 弟の 2倍に なりました。\n兄は はじめ 何まい 持って いましたか。`,
        `哥哥的卡片是弟弟的 3 倍。哥哥给弟弟 ${x} 张后，哥哥的张数变成弟弟的 2 倍。哥哥原来有多少张？`,
        `An older brother has 3 times as many cards as his younger brother.\nAfter he gives ${x} cards away to him, he has only twice as many.\nHow many cards did the older brother start with?`),
    unit:G('まい','张','cards'),val:9*x,sec:120,
    exp:G(`弟を ①と すると 兄は ③。やりとり後は 兄 ③−${x}、弟 ①+${x} で、③−${x}=(①+${x})×2。\n③−${x}=②+${2*x} より ①=${3*x}まい。兄は ${3*x}×3=${9*x}まい。`,
          `设弟弟为 ①，哥哥为 ③。交换后 ③−${x} = 2×(①+${x})，解得 ① = ${3*x} 张，哥哥 = ${9*x} 张。`,
          `Let the younger brother have 1 unit, so the older has 3. Afterwards 3 units −${x} = 2 × (1 unit +${x}).\nThat gives 1 unit = ${3*x} cards, so the older brother began with ${3*x}×3=${9*x}.`)});}),

CQ(()=>{ const s=[R(62,88),R(62,88),R(62,88),R(62,88)],m=R(75,85);
  const need=5*m-s.reduce((a,b)=>a+b,0);
  if(need<0||need>100) return COMP[4][0]();
  return QI({tag:G('応用・平均','综合 · 平均','Applied · averages'),
